<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="English learning platform for vocational high schools.">
<title>SMK English — Learning Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12263F;
  --navy-deep:#0D1B2E;
  --navy-soft:#24405F;
  --ivory:#FAF8F4;
  --paper:#FFFFFF;
  --line:#DCE2E9;
  --line-strong:#C3CCD7;
  --muted:#5C6B7F;
  --text:#1B2734;
  --green:#2F6B55;
  --green-soft:#EAF2EE;
  --blue:#2B5F9E;
  --blue-soft:#EAF0F8;
  --amber:#7D6216;
  --amber-soft:#F7F1DE;
  --rose:#8C2F35;
  --rose-soft:#F8ECEC;
  --radius:6px;
  --shadow:0 6px 24px rgba(18,38,63,.12);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  font-size:15px;line-height:1.55;color:var(--text);background:var(--ivory);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;color:var(--navy);margin:0 0 .4em;line-height:1.25}
h1{font-size:1.85rem;letter-spacing:-.01em}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0 0 .8em;max-width:72ch}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- top bar ---------- */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:18px;min-height:60px}
.wordmark{font-family:var(--serif);font-size:1.1rem;font-weight:600;letter-spacing:.01em;color:#fff;text-decoration:none;white-space:nowrap}
.wordmark span{display:block;font-family:var(--sans);font-size:.66rem;font-weight:400;color:#A9BDD4;letter-spacing:.06em}
.mainnav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.mainnav a{
  color:#CBD8E6;text-decoration:none;padding:8px 11px;border-radius:4px;font-size:.87rem;font-weight:500;
  border-bottom:2px solid transparent;
}
.mainnav a:hover{color:#fff;background:rgba(255,255,255,.07)}
.mainnav a[aria-current="page"]{color:#fff;border-bottom-color:#8FB2D8}
.navtoggle{display:none;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:4px;padding:7px 10px;font-size:.9rem;cursor:pointer}
.profilewrap{position:relative}
.profilebtn{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  color:#fff;border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font:inherit;font-size:.85rem;
}
.avatar{width:26px;height:26px;border-radius:50%;background:#8FB2D8;color:var(--navy);display:grid;place-items:center;font-weight:600;font-size:.75rem}
.profilemenu{
  position:absolute;right:0;top:calc(100% + 8px);background:var(--paper);color:var(--text);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);min-width:230px;padding:10px;display:none
}
.profilemenu.open{display:block}
.profilemenu .who{padding:6px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.profilemenu .who strong{display:block;font-size:.95rem}
.profilemenu .who small{color:var(--muted)}
.profilemenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:4px;cursor:pointer;font:inherit;font-size:.88rem;color:var(--text)}
.profilemenu button:hover{background:var(--ivory)}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:28px 20px 72px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:1px solid var(--line-strong);margin-bottom:22px}
.pagehead p{color:var(--muted);margin:0;font-size:.92rem}
.pagehead .actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{margin-bottom:.3em}
.card .lead{font-family:var(--serif);font-size:2rem;color:var(--navy);line-height:1}
.card .label{color:var(--muted);font-size:.82rem}
.section{margin-top:28px}
.section > h2{padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* ---------- controls ---------- */
button,.btn{font:inherit}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--navy);background:var(--navy);color:#fff;
  padding:8px 15px;border-radius:4px;cursor:pointer;font-size:.88rem;font-weight:500;text-decoration:none;
}
.btn:hover{background:var(--navy-soft);border-color:var(--navy-soft)}
.btn.secondary{background:var(--paper);color:var(--navy);border-color:var(--line-strong)}
.btn.secondary:hover{background:var(--ivory)}
.btn.quiet{background:none;border-color:transparent;color:var(--blue);padding:6px 8px}
.btn.quiet:hover{background:var(--blue-soft)}
.btn.danger{background:var(--paper);color:var(--rose);border-color:#D9B9BB}
.btn.small{padding:5px 10px;font-size:.8rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
label{display:block;font-size:.84rem;font-weight:500;color:var(--navy);margin-bottom:4px}
input,select,textarea{
  width:100%;font:inherit;font-size:.92rem;padding:8px 10px;border:1px solid var(--line-strong);
  border-radius:4px;background:var(--paper);color:var(--text)
}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input[type=file]{padding:6px;background:var(--ivory)}
input[type=checkbox]{width:auto}
.field{margin-bottom:14px}
.field .hint{font-size:.78rem;color:var(--muted);margin-top:4px}
.fieldrow{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fieldrow.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.checkline{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.checkline label{margin:0;font-weight:400;font-size:.88rem;color:var(--text)}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px}
.filterbar .field{margin:0;min-width:150px;flex:1}

/* ---------- tables ---------- */
.tablewrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:.89rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#F4F6F9;color:var(--navy);font-weight:600;font-size:.8rem}
tbody tr:last-child td{border-bottom:0}
td .btn{margin-right:4px}
td.rowacts{white-space:nowrap}

/* ---------- badges & feedback ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.73rem;font-weight:600;padding:2px 8px;border-radius:3px;border:1px solid transparent;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.published,.badge.active,.badge.graded,.badge.completed{background:var(--green-soft);color:var(--green);border-color:#CADCD4}
.badge.draft,.badge.in_progress,.badge.submitted{background:var(--amber-soft);color:var(--amber);border-color:#E5DCC0}
.badge.archived,.badge.inactive,.badge.not_submitted,.badge.not_started{background:#EEF1F4;color:var(--muted);border-color:var(--line)}
.badge.info{background:var(--blue-soft);color:var(--blue);border-color:#C9D9EC}
.notice{border:1px solid var(--line);border-left:3px solid var(--blue);background:var(--blue-soft);padding:12px 14px;border-radius:4px;font-size:.88rem;margin-bottom:16px}
.notice.warn{border-left-color:var(--amber);background:var(--amber-soft)}
.notice.error{border-left-color:var(--rose);background:var(--rose-soft)}
.empty{background:var(--paper);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:36px 24px;text-align:center}
.empty h3{margin-bottom:.2em}
.empty p{margin:0 auto .9em;color:var(--muted);max-width:44ch}
.loading{padding:40px;text-align:center;color:var(--muted);font-size:.9rem}
.meter{height:6px;background:#E8ECF1;border-radius:3px;overflow:hidden;margin-top:6px}
.meter > span{display:block;height:100%;background:var(--green)}
.barlist{display:flex;flex-direction:column;gap:10px}
.barlist .barrow{display:grid;grid-template-columns:130px 1fr 58px;gap:10px;align-items:center;font-size:.85rem}
.barlist .track{height:16px;background:#EDF0F4;border-radius:2px;overflow:hidden}
.barlist .track > span{display:block;height:100%;background:var(--blue)}

/* ---------- toast & modal ---------- */
#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:11px 15px;border-radius:4px;box-shadow:var(--shadow);font-size:.87rem;max-width:330px}
.toast.error{background:var(--rose)}
.toast.success{background:var(--green)}
.modal-backdrop{position:fixed;inset:0;background:rgba(13,27,46,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto}
.modal{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:640px}
.modal.wide{max-width:900px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:1.1rem}
.modal .body{padding:20px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#FBFCFD}
.iconbtn{background:none;border:0;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.auth .brandside{background:var(--navy);color:#fff;padding:56px 48px;display:flex;flex-direction:column;justify-content:center}
.auth .brandside h1{color:#fff;font-size:2.35rem;max-width:12ch}
.auth .brandside p{color:#BACBDD;max-width:40ch}
.auth .brandside ul{list-style:none;padding:0;margin:28px 0 0;color:#CBD8E6;font-size:.9rem}
.auth .brandside li{padding:7px 0;border-top:1px solid rgba(255,255,255,.14)}
.auth .formside{display:flex;align-items:center;justify-content:center;padding:48px 24px;background:var(--ivory)}
.auth .formside .box{width:100%;max-width:380px}

/* ---------- lesson reading ---------- */
.lessonblock{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--navy-soft);
  border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.lessonblock .kind{font-size:.74rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.lessonblock .text{white-space:pre-wrap;font-family:var(--serif);font-size:1.02rem;line-height:1.65;max-width:70ch}
.builderblock{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.builderblock .bhead{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.builderblock .bhead select{max-width:190px}
.vocabgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.vocabcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.vocabcard .term{font-family:var(--serif);font-size:1.1rem;color:var(--navy);font-weight:600}
.quizq{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.quizq .qtext{font-family:var(--serif);font-size:1.05rem;margin-bottom:12px}
.optline{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:4px;margin-bottom:7px;cursor:pointer}
.optline:hover{background:var(--ivory)}
.optline input{width:auto;margin-top:3px}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--navy);background:var(--amber-soft);border:1px solid #E5DCC0;border-radius:4px;padding:5px 11px;font-size:.9rem}
.aipanel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.aiout{white-space:pre-wrap;background:var(--ivory);border:1px solid var(--line);border-radius:4px;padding:14px;font-size:.92rem;line-height:1.6;max-height:420px;overflow:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;cursor:pointer;font:inherit;font-size:.9rem;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:.85rem;color:var(--muted)}

@media (max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth .brandside{padding:38px 26px}
  .auth .brandside h1{font-size:1.8rem}
  .grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .navtoggle{display:inline-block;order:2;margin-left:auto}
  .profilewrap{order:3}
  .mainnav{order:4;flex-basis:100%;flex-direction:column;display:none;padding-bottom:10px}
  .mainnav.open{display:flex}
  .mainnav a{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.08);border-radius:0}
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}
  .fieldrow,.fieldrow.three{grid-template-columns:1fr}
  main{padding:20px 14px 60px}
  h1{font-size:1.5rem}
  /* tables become stacked records on small screens */
  table.responsive thead{display:none}
  table.responsive tr{display:block;border-bottom:1px solid var(--line);padding:10px 12px}
  table.responsive td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0}
  table.responsive td::before{content:attr(data-label);font-weight:600;color:var(--muted);font-size:.78rem}
  .barlist .barrow{grid-template-columns:100px 1fr 46px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<a class="sr-only" href="#main">Skip to content</a>
<div id="shell"></div>
<div id="modal-root"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
/* =========================================================================
 * SMK ENGLISH LEARNING PLATFORM — FRONTEND
 * Single file. Talks to the Apps Script Web App over HTTPS.
 * The backend is authoritative for identity, role and every score.
 * ========================================================================= */

/* --- 1. CONFIGURATION ------------------------------------------------- */
/* Paste your Apps Script Web App /exec URL here. This is the only value to edit. */
var API_BASE_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_EXEC_URL_HERE';

var APP = {
  timeoutMs: 45000,
  storageKey: 'smk_english_token',
  maxUploadBytes: 8 * 1024 * 1024
};

/* --- 2. STATE --------------------------------------------------------- */
var State = {
  token: null,
  user: null,          // filled from the backend only, never from storage
  ai: { available: false, features: [] },
  booted: false,
  view: {}             // scratch space for the active view
};

/* --- 3. SMALL UTILITIES ----------------------------------------------- */
function esc(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uuid() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 'r-' + Date.now() + '-' + Math.random().toString(36).slice(2, 11);
}
function qs(sel, root) { return (root || document).querySelector(sel); }
function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function num(v, fb) { var n = Number(v); return isFinite(n) ? n : (fb === undefined ? 0 : fb); }
function pct(v) { var n = num(v, 0); if (!isFinite(n)) n = 0; return Math.max(0, Math.min(100, n)); }
function initials(name) {
  var parts = String(name || '?').trim().split(/\s+/);
  return ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function fmtDate(iso, withTime) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  var opts = { year: 'numeric', month: 'short', day: 'numeric' };
  if (withTime) { opts.hour = '2-digit'; opts.minute = '2-digit'; }
  return d.toLocaleDateString('en-GB', opts);
}
function toDatetimeLocal(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function titleCase(s) {
  return String(s || '').toLowerCase().replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
}
function badge(status) {
  var s = String(status || '').toUpperCase();
  return '<span class="badge ' + esc(s.toLowerCase()) + '">' + esc(titleCase(s)) + '</span>';
}
function selectOptions(values, selected) {
  return values.map(function (v) {
    var val = (typeof v === 'object') ? v.value : v;
    var label = (typeof v === 'object') ? v.label : titleCase(v);
    return '<option value="' + esc(val) + '"' + (String(selected) === String(val) ? ' selected' : '') + '>' + esc(label) + '</option>';
  }).join('');
}
function toast(message, kind) {
  var root = qs('#toasts');
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = message;
  root.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4200);
}
function fileToBase64(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var result = String(reader.result || '');
      var comma = result.indexOf(',');
      resolve(comma >= 0 ? result.slice(comma + 1) : result);
    };
    reader.onerror = function () { reject(new Error('The file could not be read.')); };
    reader.readAsDataURL(file);
  });
}

/* --- 4. API CLIENT ---------------------------------------------------- */
function ApiError(code, message) { this.code = code; this.message = message; }
ApiError.prototype = Object.create(Error.prototype);

var ERROR_TEXT = {
  AUTH_REQUIRED: 'Sign in to continue.',
  AUTH_INVALID: 'Your session is no longer valid. Sign in again.',
  AUTH_EXPIRED: 'Your session has expired. Sign in again.',
  FORBIDDEN: 'You do not have access to that.',
  INVALID_ACTION: 'That request is not supported.',
  NOT_FOUND: 'That item no longer exists.',
  VALIDATION_ERROR: 'Check the form and try again.',
  DUPLICATE: 'That already exists.',
  CONFLICT: 'Someone changed this at the same time. Reload and try again.',
  RATE_LIMITED: 'You have reached the limit for now.',
  AI_DISABLED: 'The AI assistant is switched off.',
  AI_NOT_CONFIGURED: 'The AI assistant is not configured.',
  AI_TIMEOUT: 'The AI assistant did not respond.',
  AI_PROVIDER_ERROR: 'The AI assistant is unavailable.',
  AI_QUOTA_EXCEEDED: 'The AI daily limit has been reached.',
  STORAGE_ERROR: 'The file could not be stored.',
  DATABASE_ERROR: 'The database is unavailable.',
  INTERNAL_ERROR: 'Something went wrong on the server.',
  NETWORK_ERROR: 'The server cannot be reached. Check your connection and the API address.',
  TIMEOUT: 'The server took too long to answer.'
};

/**
 * Single entry point for every backend call.
 * text/plain keeps the request CORS-simple, so no preflight is needed.
 */
function api(action, params, requestId) {
  if (!API_BASE_URL || API_BASE_URL.indexOf('PASTE_YOUR') === 0) {
    return Promise.reject(new ApiError('NETWORK_ERROR', 'The API address has not been set in index.html.'));
  }
  var controller = new AbortController();
  var timer = setTimeout(function () { controller.abort(); }, APP.timeoutMs);
  var body = JSON.stringify({
    action: action,
    token: State.token || '',
    requestId: requestId || uuid(),
    params: params || {}
  });

  return fetch(API_BASE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: body,
    redirect: 'follow',
    signal: controller.signal
  })
    .then(function (response) {
      clearTimeout(timer);
      return response.text().then(function (text) {
        var payload;
        try { payload = JSON.parse(text); }
        catch (e) { throw new ApiError('INTERNAL_ERROR', 'The server returned an unreadable response.'); }
        if (!payload || typeof payload !== 'object') {
          throw new ApiError('INTERNAL_ERROR', ERROR_TEXT.INTERNAL_ERROR);
        }
        if (payload.success) return payload.data || {};
        var code = (payload.error && payload.error.code) || 'INTERNAL_ERROR';
        var message = (payload.error && payload.error.message) || ERROR_TEXT[code] || ERROR_TEXT.INTERNAL_ERROR;
        if (code === 'AUTH_EXPIRED' || code === 'AUTH_INVALID' || code === 'AUTH_REQUIRED') {
          endSession(message);
        }
        throw new ApiError(code, message);
      });
    })
    .catch(function (error) {
      clearTimeout(timer);
      if (error instanceof ApiError) throw error;
      if (error && error.name === 'AbortError') throw new ApiError('TIMEOUT', ERROR_TEXT.TIMEOUT);
      throw new ApiError('NETWORK_ERROR', ERROR_TEXT.NETWORK_ERROR);
    });
}

function endSession(message) {
  State.token = null;
  State.user = null;
  try { localStorage.removeItem(APP.storageKey); } catch (e) {}
  closeModal();
  renderLogin(message || 'Sign in to continue.');
}

var modalLastFocus = null;
function openModal(title, bodyHtml, footerHtml, wide) {
  modalLastFocus = document.activeElement;
  qs('#modal-root').innerHTML =
    '<div class="modal-backdrop" data-act="modal-backdrop">' +
      '<div class="modal' + (wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +

        '<div class="body">' + bodyHtml + '</div>' +
        (footerHtml ? '<footer>' + footerHtml + '</footer>' : '') +
      '</div>' +
    '</div>';
  var first = qs('#modal-root input, #modal-root select, #modal-root textarea, #modal-root button');
  if (first) first.focus();
}
function closeModal() {
  qs('#modal-root').innerHTML = '';
  if (modalLastFocus && modalLastFocus.focus) { try { modalLastFocus.focus(); } catch (e) {} }
  modalLastFocus = null;
}
function formValues(form) {
  var out = {};
  qsa('input,select,textarea', form).forEach(function (el) {
    if (!el.name) return;
    if (el.type === 'checkbox') {
      if (el.dataset.multi === 'true') {
        if (!Array.isArray(out[el.name])) out[el.name] = [];
        if (el.checked) out[el.name].push(el.value);
      } else out[el.name] = el.checked;
    } else if (el.type === 'radio') {
      if (el.checked) out[el.name] = el.value;
    } else if (el.type !== 'file') {
      out[el.name] = el.value;
    }
  });
  return out;
}
function busy(el, isBusy, busyLabel) {
  if (!el) return;
  if (isBusy) {
    el.dataset.label = el.textContent;
    el.textContent = busyLabel || 'Working…';
    el.disabled = true;
  } else {
    if (el.dataset.label) el.textContent = el.dataset.label;
    el.disabled = false;
  }
}

function doLogin(form) {
  var values = formValues(form);
  var button = qs('button[type=submit]', form);
  var box = qs('#login-error');
  box.innerHTML = '';
  if (!values.email || !values.password) {
    box.innerHTML = '<div class="notice error">Enter your email and password.</div>';
    return;
  }
  busy(button, true, 'Signing in…');
  api('auth.login', { email: values.email, password: values.password })
    .then(function (data) {
      State.token = data.token;
      State.user = data.user;
      try { localStorage.setItem(APP.storageKey, data.token); } catch (e) {}
      startApp();
    })
    .catch(function (error) {
      busy(button, false);
      box.innerHTML = '<div class="notice error">' + esc(error.message) + '</div>';
    });
}

/* --- 9. BOOT AND ROUTER ----------------------------------------------- */
function boot() {
  var stored = null;
  try { stored = localStorage.getItem(APP.storageKey); } catch (e) {}
  if (!stored) { renderLogin(); return; }
  State.token = stored;
  api('auth.me', {})
    .then(function (data) {
      State.user = data.user;      // role and identity come from the backend, never from storage
      startApp();
    })
    .catch(function (error) {
      if (error.code === 'NETWORK_ERROR' || error.code === 'TIMEOUT') {
        renderLogin(error.message);
      } else if (!State.user) {
        renderLogin();
      }
    });
}

function startApp() {
  renderShell();
  loadAiStatus();
  var home = State.user.role === 'TEACHER' ? '#/dashboard' : '#/home';
  if (!location.hash || location.hash === '#' || location.hash === '#/') {
    location.hash = home;          // triggers the router through hashchange
  } else {
    route();
  }
  State.booted = true;
}

function loadAiStatus() {
  api('ai.status', {})
    .then(function (data) { State.ai = data; })

}

function parseHash() {
  var raw = (location.hash || '').replace(/^#\/?/, '');
  var parts = raw.split('/').filter(function (p) { return p !== ''; });
  return { name: parts[0] || '', id: parts[1] || '', sub: parts[2] || '' };
}

document.addEventListener('click', function (event) {

      menu.classList.remove('open');
      var pb = qs('.profilebtn'); if (pb) pb.setAttribute('aria-expanded', 'false');
    }
    return;
  }
  var act = target.getAttribute('data-act');
  if (target.tagName === 'FORM') return;
  var handler = Actions[act];
  if (!handler) return;
  event.preventDefault();
  handler(target, event);

  var form = event.target.closest('form[data-act]');
  if (!form) return;

  var handler = Actions[form.getAttribute('data-act')];

function syncBlockFields() {
  qsa('[data-block-field]').forEach(function (el) {
    var index = num(el.getAttribute('data-index'), -1);
    var field = el.getAttribute('data-block-field');
    if (index >= 0 && State.view.blocks[index]) State.view.blocks[index][field] = el.value;
  });
}

  var index = num(btn.getAttribute('data-index'), 0);

  busy(btn, true, 'Uploading…');
  fileToBase64(file).then(function (base64) {

    State.view.blocks[index].fileId = data.material.fileId;
    State.view.blocks[index].fileName = data.material.fileName;

function questionForm(rec) {
  var q = rec || {};
  var options = (q.options && q.options.length) ? q.options : ['', '', '', ''];
  while (options.length < 4) options.push('');
  return '<form data-act="question-save"' + (q.id ? ' data-id="' + esc(q.id) + '"' : '') + '>' +
    '<div id="qs-msg"></div>' +
    '<div class="fieldrow">' +
      '<div class="field"><label for="qs-type">Type</label><select id="qs-type" name="type">' +
        selectOptions(QUESTION_TYPES.map(function (t) { return { value: t, label: titleCase(t) }; }), q.type || 'MCQ') + '</select></div>' +
      '<div class="field"><label for="qs-skill">Skill</label><select id="qs-skill" name="skill">' +
        selectOptions(SKILLS.map(function (s) { return { value: s, label: titleCase(s) }; }), q.skill || 'GRAMMAR') + '</select></div>' +
    '</div>' +
    '<div class="field"><label for="qs-question">Question</label>' +
      '<textarea id="qs-question" name="question" rows="3" required maxlength="4000">' + esc(q.question || '') + '</textarea></div>' +
    '<div id="qs-answer">' + questionAnswerFields(q.type || 'MCQ', options, q.correctAnswer || '') + '</div>' +
    '<div class="field"><label for="qs-explanation">Explanation</label>' +
      '<textarea id="qs-explanation" name="explanation" rows="2" maxlength="2000">' + esc(q.explanation || '') + '</textarea></div>' +
    '<div class="fieldrow three">' +
      '<div class="field"><label for="qs-diff">Difficulty</label><select id="qs-diff" name="difficulty">' +
        selectOptions(DIFFICULTIES.map(function (d) { return { value: d, label: titleCase(d) }; }), q.difficulty || 'MEDIUM') + '</select></div>' +
      '<div class="field"><label for="qs-phase">Phase</label><input id="qs-phase" name="phase" maxlength="20" value="' + esc(q.phase || '') + '"></div>' +
      '<div class="field"><label for="qs-grade">Grade</label><input id="qs-grade" name="grade" maxlength="20" value="' + esc(q.grade || '') + '"></div>' +
    '</div>' +
    '<div class="field"><label for="qs-topic">Topic</label><input id="qs-topic" name="topic" maxlength="160" value="' + esc(q.topic || '') + '"></div>' +
    '<button class="btn" type="submit">' + (q.id ? 'Save question' : 'Create question') + '</button>' +
  '</form>';
}

function questionAnswerFields(type, options, correct) {
  if (type === 'MCQ') {
    return '<div class="field"><label>Options and correct answer</label>' +
      '<p class="hint">Fill at least two options, then choose which one is correct.</p>' +
      options.map(function (opt, i) {
        return '<div class="checkline">' +
          '<input type="radio" id="qs-correct-' + i + '" name="correctIndex" aria-label="Option ' + (i + 1) + ' is correct" value="' + i + '"' + (String(correct) !== '' && opt === correct ? ' checked' : (correct === '' && i === 0 ? ' checked' : '')) + '>' +
          '<input type="text" name="option" data-option="' + i + '" maxlength="300" aria-label="Option ' + (i + 1) + ' text" placeholder="Option ' + (i + 1) + '" value="' + esc(opt) + '">' +
        '</div>';
      }).join('') + '</div>';
  }
  if (type === 'TRUE_FALSE') {
    return '<div class="field"><label for="qs-tf">Correct answer</label><select id="qs-tf" name="correctAnswer">' +
      selectOptions([{ value: 'TRUE', label: 'True' }, { value: 'FALSE', label: 'False' }], String(correct || 'TRUE').toUpperCase()) + '</select></div>';
  }
  if (type === 'SHORT_ANSWER') {
    return '<div class="field"><label for="qs-sa">Correct answer</label>' +
      '<input id="qs-sa" name="correctAnswer" maxlength="200" required value="' + esc(correct || '') + '">' +
      '<div class="hint">Matching ignores capital letters and extra spaces.</div></div>';
  }
  return '<div class="notice">This question type is graded by the teacher, so it has no stored answer key.</div>';
}

    type: values.type, skill: values.skill, question: values.question,
    explanation: values.explanation, difficulty: values.difficulty,
    phase: values.phase, grade: values.grade, topic: values.topic,
    options: [], correctAnswer: ''
  };
  if (values.type === 'MCQ') {

Actions['quiz-new'] = function () { quizForm(null).then(function (html) { openModal('New quiz', html); }); };
Actions['quiz-edit'] = function () {
  quizForm(State.view.quiz).then(function (html) { openModal('Quiz settings', html); });
};
Actions['quiz-save'] = function (form) {
  var values = formValues(form);
  var id = form.getAttribute('data-id');
  var button = qs('button[type=submit]', form);
  var payload = {
    title: values.title, description: values.description,
    timeLimitMinutes: num(values.timeLimitMinutes, 0),
    maxAttempts: num(values.maxAttempts, 1),
    resultVisibility: values.resultVisibility,
    randomize: values.randomize === true,
    classIds: Array.isArray(values.classIds) ? values.classIds : []
  };
  if (id) payload.id = id;
  busy(button, true, 'Saving…');
  api(id ? 'quiz.update' : 'quiz.create', payload)
    .then(function (data) {
      closeModal();
      toast(id ? 'Quiz saved.' : 'Quiz created.', 'success');
      if (id) viewQuizBuilder(id); else location.hash = '#/quizzes/' + data.quiz.id;
    })
    .catch(function (error) {
      busy(button, false);
      qs('#qz-msg').innerHTML = '<div class="notice error">' + esc(error.message) + '</div>';
    });
};

function viewQuizBuilder(quizId) {
  showLoading();
  Promise.all([
    api('quiz.get', { id: quizId }),
    api('question.list', { status: 'PUBLISHED', pageSize: 200 }),
    api('quiz.results', { quizId: quizId })
  ]).then(function (res) {
    var quiz = res[0].quiz;
    var chosen = res[0].questions || [];
    var bank = res[1].items || [];
    var results = res[2];
    State.view.quiz = quiz;
    State.view.quizQuestions = chosen.map(function (q) { return { questionId: q.questionId, points: num(q.points, 1) }; });
    State.view.quizBank = bank;

    var chosenIds = {};
    chosen.forEach(function (q) { chosenIds[q.questionId] = true; });

    var chosenHtml = chosen.length
      ? chosen.map(function (q, i) {
          return '<div class="builderblock"><div class="bhead">' +
            '<strong>' + (i + 1) + '.</strong> <span class="badge info">' + esc(titleCase(q.type)) + '</span>' +
            '<span class="small muted">' + esc(titleCase(q.skill)) + '</span>' +
            '<span style="margin-left:auto"></span>' +
            '<label class="small muted" for="qp-' + esc(q.questionId) + '">Points</label>' +
            '<input id="qp-' + esc(q.questionId) + '" type="number" min="1" max="100" style="width:80px" data-points="' + esc(q.questionId) + '" value="' + num(q.points, 1) + '">' +
            '<button class="btn small quiet" data-act="quiz-remove-question" data-id="' + esc(q.questionId) + '">Remove</button>' +
          '</div><div class="small">' + esc(q.question) + '</div></div>';
        }).join('')
      : '<p class="small muted">No questions in this quiz yet. Add some from the bank below.</p>';

    var bankHtml = bank.length
      ? bank.filter(function (q) { return !chosenIds[q.id]; }).map(function (q) {
          var text = q.question.length > 110 ? q.question.slice(0, 110) + '…' : q.question;
          return '<div class="builderblock"><div class="bhead">' +
            '<span class="badge info">' + esc(titleCase(q.type)) + '</span>' +
            '<span class="small muted">' + esc(titleCase(q.skill)) + ' · ' + esc(titleCase(q.difficulty)) + '</span>' +
            '<span style="margin-left:auto"></span>' +
            '<button class="btn small secondary" data-act="quiz-add-question" data-id="' + esc(q.id) + '">Add</button>' +
          '</div><div class="small">' + esc(text) + '</div></div>';
        }).join('') || '<p class="small muted">Every published question is already in this quiz.</p>'
      : emptyState('No published questions', 'Publish questions in the question bank before building a quiz.',
          '<a class="btn" href="#/questions">Go to question bank</a>');

    var attempts = results.attempts || [];
    var resultsHtml = attempts.length
      ? '<div class="tablewrap"><table class="responsive"><thead><tr><th>Student</th><th>Attempt</th><th>Score</th><th>Percent</th><th>Submitted</th></tr></thead><tbody>' +
        attempts.map(function (a) {
          return '<tr>' +
            '<td data-label="Student">' + esc(a.studentName) + '</td>' +
            '<td data-label="Attempt">' + num(a.attemptNumber, 1) + '</td>' +
            '<td data-label="Score">' + num(a.score, 0) + ' / ' + num(a.maxScore, 0) + '</td>' +
            '<td data-label="Percent">' + num(a.percentage, 0) + '%</td>' +
            '<td data-label="Submitted">' + esc(fmtDate(a.submittedAt, true)) + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>' +
        '<p class="small muted">Class average: ' + num(results.average, 0) + '%</p>'
      : '<p class="small muted">No learning data available yet.</p>';

    setView(
      pageHead(quiz.title, 'Quiz · ' + titleCase(quiz.status) + ' · maximum score ' + num(quiz.maxScore, 0),
        '<button class="btn secondary" data-act="quiz-edit">Settings</button> ' +
        '<button class="btn secondary" data-act="quiz-save-questions">Save questions</button> ' +
        (quiz.status === 'PUBLISHED'
          ? '<button class="btn secondary" data-act="quiz-status" data-status="DRAFT">Unpublish</button>'
          : '<button class="btn" data-act="quiz-status" data-status="PUBLISHED">Publish</button>') + ' ' +
        (quiz.status !== 'ARCHIVED' ? '<button class="btn danger" data-act="quiz-status" data-status="ARCHIVED">Archive</button>' : '') +
        ' <a class="btn quiet" href="#/quizzes">Back</a>') +
      (quiz.description ? '<p class="muted">' + esc(quiz.description) + '</p>' : '') +
      '<div class="section"><h2>Questions in this quiz</h2>' + chosenHtml + '</div>' +
      '<div class="section"><h2>Question bank</h2>' + bankHtml + '</div>' +
      '<div class="section"><h2>Results</h2>' + resultsHtml + '</div>'
    );
  }).catch(showError);
}

function collectQuizPoints() {
  qsa('[data-points]').forEach(function (el) {
    var id = el.getAttribute('data-points');
    State.view.quizQuestions.forEach(function (q) {
      if (q.questionId === id) q.points = Math.max(1, num(el.value, 1));
    });
  });
}
Actions['quiz-add-question'] = function (btn) {
  collectQuizPoints();
  var id = btn.getAttribute('data-id');
  var exists = State.view.quizQuestions.some(function (q) { return q.questionId === id; });
  if (exists) { toast('That question is already in the quiz.', 'error'); return; }
  State.view.quizQuestions.push({ questionId: id, points: 1 });
  saveQuizQuestions(btn);
};
Actions['quiz-remove-question'] = function (btn) {
  collectQuizPoints();
  var id = btn.getAttribute('data-id');
  State.view.quizQuestions = State.view.quizQuestions.filter(function (q) { return q.questionId !== id; });
  saveQuizQuestions(btn);
};
Actions['quiz-save-questions'] = function (btn) { collectQuizPoints(); saveQuizQuestions(btn); };

function saveQuizQuestions(btn) {
  busy(btn, true, 'Saving…');
  api('quiz.setQuestions', { id: State.view.quiz.id, questions: State.view.quizQuestions })
    .then(function () { toast('Quiz questions saved.', 'success'); viewQuizBuilder(State.view.quiz.id); })
    .catch(function (error) { busy(btn, false); toast(error.message, 'error'); });
}
Actions['quiz-status'] = function (btn) {
  var status = btn.getAttribute('data-status');
  busy(btn, true, 'Saving…');
  api('quiz.setStatus', { id: State.view.quiz.id, status: status })
    .then(function () { toast('Quiz ' + status.toLowerCase() + '.', 'success'); viewQuizBuilder(State.view.quiz.id); })
    .catch(function (error) { busy(btn, false); toast(error.message, 'error'); });
};

function viewStudentAssignment(assignmentId) {
  showLoading();

    var a = data.assignment;
    var s = data.submission;
    State.view.assignmentId = a.id;
    State.view.submitRequestId = uuid();   // one stable id, reused if the student retries

    var isText = a.submissionType === 'TEXT';
    var accept = a.submissionType === 'AUDIO' ? 'audio/*' : (a.submissionType === 'VIDEO' ? 'video/*' : '');
    var locked = s && s.status === 'GRADED';

    var resultHtml = '';
    if (s && s.resultReleased) {
      var rubric = s.rubric;
      resultHtml = '<div class="section"><h2>Your result</h2><div class="card">' +
        '<div class="lead">' + (s.score === '' ? '—' : esc(String(s.score)) + ' / ' + num(a.maxScore, 100)) + '</div>' +
        (s.feedback ? '<p class="small" style="margin-top:10px"><strong>Teacher feedback</strong><br>' + esc(s.feedback) + '</p>' : '') +
        (rubric
          ? '<div class="barlist" style="margin-top:12px">' +
              barRow('Pronunciation', rubric.pronunciation, String(num(rubric.pronunciation, 0))) +
              barRow('Fluency', rubric.fluency, String(num(rubric.fluency, 0))) +
              barRow('Vocabulary', rubric.vocabulary, String(num(rubric.vocabulary, 0))) +
              barRow('Grammar', rubric.grammar, String(num(rubric.grammar, 0))) +
            '</div>' + (rubric.notes ? '<p class="small muted">' + esc(rubric.notes) + '</p>' : '')
          : '') +
      '</div></div>';
    } else if (s) {
      resultHtml = '<div class="section"><h2>Your result</h2>' +
        '<p class="small muted">Your work has been received. Your teacher will release the result.</p></div>';
    }

    var formHtml = locked
      ? '<div class="notice">This work has been graded, so it can no longer be changed.</div>'
      : '<form data-act="submit-assignment">' +
          '<div id="sa-msg"></div>' +
          (isText
            ? '<div class="field"><label for="sa-text">Your answer</label>' +
                '<textarea id="sa-text" name="contentText" rows="10" required maxlength="20000">' + esc(s ? s.contentText : '') + '</textarea></div>'
            : '<div class="field"><label for="sa-file">Your file</label>' +
                '<input id="sa-file" name="file" type="file"' + (accept ? ' accept="' + accept + '"' : '') + ' required>' +
                '<div class="hint">Maximum 8 MB.' + (a.submissionType === 'AUDIO' ? ' Record your speaking task and upload the audio file.' : '') + '</div></div>' +
              '<div class="field"><label for="sa-note">Note for your teacher (optional)</label>' +
                '<textarea id="sa-note" name="contentText" rows="3" maxlength="5000">' + esc(s ? s.contentText : '') + '</textarea></div>') +
          '<button class="btn" type="submit">' + (s ? 'Replace my submission' : 'Hand in') + '</button>' +
        '</form>';

    setView(
      pageHead(a.title, 'Due ' + fmtDate(a.dueDate, true) + ' · ' + titleCase(a.submissionType) + ' · maximum ' + num(a.maxScore, 100) + ' points',
        '<a class="btn secondary" href="#/assignments">Back</a>') +
      '<div class="lessonblock"><div class="kind">Instructions</div><div class="text">' + esc(a.instructions) + '</div></div>' +
      (a.lessonTitle ? '<p class="small"><a href="#/lessons/' + esc(a.lessonId) + '">Open the related lesson: ' + esc(a.lessonTitle) + '</a></p>' : '') +
      (s ? '<p class="small muted">Last handed in ' + esc(fmtDate(s.submittedAt, true)) +
            (s.fileName ? ' · <a href="' + esc(s.fileUrl) + '" target="_blank" rel="noopener">' + esc(s.fileName) + '</a>' : '') + '</p>' : '') +
      '<div class="section"><h2>Your submission</h2>' + formHtml + '</div>' +
      resultHtml +
      '<div class="section"><h2>Need help?</h2>' +
        aiPanel(STUDENT_AI_FEATURES, 'Paste your draft to get feedback before you hand it in.') + '</div>'
    );
  }).catch(showError);
}

Actions['submit-assignment'] = function (form) {
  var values = formValues(form);
  var button = qs('button[type=submit]', form);
  var fileInput = qs('#sa-file');
  var payload = { assignmentId: State.view.assignmentId, contentText: values.contentText || '' };
  var requestId = State.view.submitRequestId;

  function send() {
    busy(button, true, 'Sending…');
    return api('my.submitAssignment', payload, requestId)
      .then(function () {
        toast('Your work has been handed in.', 'success');
        viewStudentAssignment(State.view.assignmentId);
      })
      .catch(function (error) {
        busy(button, false);
        qs('#sa-msg').innerHTML = '<div class="notice error">' + esc(error.message) + '</div>';
      });
  }

  if (fileInput) {
    if (!fileInput.files || !fileInput.files.length) {
      qs('#sa-msg').innerHTML = '<div class="notice error">Choose a file before handing in.</div>';
      return;
    }
    var file = fileInput.files[0];
    if (file.size > APP.maxUploadBytes) {
      qs('#sa-msg').innerHTML = '<div class="notice error">That file is larger than 8 MB.</div>';
      return;
    }
    busy(button, true, 'Uploading…');
    fileToBase64(file).then(function (base64) {
      payload.fileName = file.name;
      payload.mimeType = file.type || 'application/octet-stream';
      payload.base64 = base64;
      return send();
    }).catch(function (error) {
      busy(button, false);
      qs('#sa-msg').innerHTML = '<div class="notice error">' + esc(error.message) + '</div>';
    });
    return;
  }
  send();
};

Actions['practice-start'] = function (form) {
  var values = formValues(form);
  var button = qs('button[type=submit]', form);
  var body = qs('#drill-body');
  busy(button, true, 'Loading…');
  api('my.practiceSet', { skill: values.skill, size: num(values.size, 8) }).then(function (data) {
    busy(button, false);

      body.innerHTML = '<div class="notice">' + esc(data.message || 'No practice questions are available yet.') + '</div>';
      return;
    }
    State.view.drill = data.questions;
    body.innerHTML = '<form data-act="practice-check">' +
      data.questions.map(function (q, i) { return practiceQuestionHtml(q, i); }).join('') +
      '<button class="btn" type="submit">Check my answers</button></form>' +
      '<div id="drill-result"></div>';
  }).catch(function (error) { busy(button, false); toast(error.message, 'error'); });
};

function practiceQuestionHtml(q, index) {
  var input;
  if (q.type === 'MCQ') {
    input = q.options.map(function (opt, j) {
      return '<label class="optline" for="dq-' + index + '-' + j + '">' +
        '<input type="radio" id="dq-' + index + '-' + j + '" name="' + esc(q.id) + '" value="' + esc(opt) + '">' +
        '<span>' + esc(opt) + '</span></label>';
    }).join('');
  } else if (q.type === 'TRUE_FALSE') {
    input = ['TRUE', 'FALSE'].map(function (v, j) {
      return '<label class="optline" for="dq-' + index + '-' + j + '">' +
        '<input type="radio" id="dq-' + index + '-' + j + '" name="' + esc(q.id) + '" value="' + v + '">' +
        '<span>' + titleCase(v) + '</span></label>';
    }).join('');
  } else {
    input = '<input type="text" id="dq-' + index + '" name="' + esc(q.id) + '" maxlength="200" placeholder="Your answer">';
  }
  return '<div class="quizq"><div class="qtext">' + (index + 1) + '. ' + esc(q.question) + '</div>' + input + '</div>';
}

Actions['practice-check'] = function (form) {
  var button = qs('button[type=submit]', form);
  var answers = {};
  (State.view.drill || []).forEach(function (q) {
    var checked = qs('input[name="' + q.id + '"]:checked', form);
    if (checked) { answers[q.id] = checked.value; return; }
    var text = qs('input[type=text][name="' + q.id + '"]', form);
    answers[q.id] = text ? text.value : '';
  });
  busy(button, true, 'Checking…');
  api('my.practiceCheck', { answers: answers }).then(function (data) {
    busy(button, false);
    var out = qs('#drill-result');
    out.innerHTML =
      '<div class="section"><h2>Result: ' + num(data.correct, 0) + ' of ' + num(data.total, 0) + ' (' + num(data.percentage, 0) + '%)</h2>' +
      data.results.map(function (r, i) {
        return '<div class="card" style="margin-bottom:10px"><div class="spread">' +
          '<strong>Question ' + (i + 1) + '</strong>' +
          (r.correct ? '<span class="badge published">Correct</span>' : '<span class="badge archived">Not correct</span>') + '</div>' +
          (r.correct ? '' : '<p class="small">Correct answer: ' + esc(r.correctAnswer) + '</p>') +
          (r.explanation ? '<p class="small muted">' + esc(r.explanation) + '</p>' : '') + '</div>';
      }).join('') + '</div>';
    out.scrollIntoView({ block: 'start' });
  }).catch(function (error) { busy(button, false); toast(error.message, 'error'); });
};

/* --- Quiz runner -------------------------------------------------------- */
var quizTimerHandle = null;
function stopQuizTimer() {
  if (quizTimerHandle) { clearInterval(quizTimerHandle); quizTimerHandle = null; }
}
window.addEventListener('hashchange', stopQuizTimer);

function viewQuizRunner(r) {
  stopQuizTimer();
  if (!r.id) { location.hash = '#/practice'; return; }
  showLoading('Preparing your quiz…');
  api('my.startQuiz', { quizId: r.id }).then(function (data) {
    State.view.attempt = data;
    State.view.quizRequestId = uuid();
    State.view.submitted = false;
    var quiz = data.quiz;
    var questions = data.questions || [];

    setView(
      pageHead(quiz.title, 'Attempt ' + num(quiz.attemptNumber, 1) + ' of ' + num(quiz.maxAttempts, 1),
        (quiz.timeLimitMinutes ? '<span class="timer" id="quiz-timer" role="status">--:--</span>' : '')) +
      (quiz.description ? '<p class="muted">' + esc(quiz.description) + '</p>' : '') +
      '<div class="notice">Your answers are scored on the server. Leaving this page ends the attempt without a score.</div>' +
      '<form data-act="quiz-submit" id="quiz-form">' +
        questions.map(function (q, i) { return quizQuestionHtml(q, i); }).join('') +
        '<div id="quiz-msg"></div>' +
        '<button class="btn" type="submit">Hand in this quiz</button>' +
      '</form>'
    );

    if (quiz.timeLimitMinutes) startQuizCountdown(num(quiz.timeLimitMinutes, 0) * 60);
  }).catch(showError);
}

function quizQuestionHtml(q, index) {
  var input;

    input = (q.options || []).map(function (opt, j) {
      return '<label class="optline" for="qq-' + index + '-' + j + '">' +
        '<input type="radio" id="qq-' + index + '-' + j + '" name="' + esc(q.questionId) + '" value="' + esc(opt) + '">' +
        '<span>' + esc(opt) + '</span></label>';
    }).join('');
  } else if (q.type === 'TRUE_FALSE') {
    input = ['TRUE', 'FALSE'].map(function (v, j) {
      return '<label class="optline" for="qq-' + index + '-' + j + '">' +
        '<input type="radio" id="qq-' + index + '-' + j + '" name="' + esc(q.questionId) + '" value="' + v + '">' +
        '<span>' + titleCase(v) + '</span></label>';
    }).join('');
  } else if (q.type === 'SHORT_ANSWER') {
    input = '<input type="text" id="qq-' + index + '" name="' + esc(q.questionId) + '" maxlength="200" placeholder="Your answer">';
  } else {
    input = '<textarea id="qq-' + index + '" name="' + esc(q.questionId) + '" rows="5" maxlength="5000" placeholder="Write your answer"></textarea>' +
      '<p class="hint">Your teacher reads and scores this answer.</p>';
  }
  return '<div class="quizq"><div class="qtext">' + (index + 1) + '. ' + esc(q.question) +
    ' <span class="small muted">(' + num(q.points, 1) + ' point' + (num(q.points, 1) === 1 ? '' : 's') + ')</span></div>' +
    input + '</div>';
}

function startQuizCountdown(seconds) {
  var remaining = seconds;
  var el = qs('#quiz-timer');
  function paint() {
    if (!el) return;
    var m = Math.floor(remaining / 60), s = remaining % 60;
    el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  paint();
  quizTimerHandle = setInterval(function () {
    remaining--;
    if (remaining <= 0) {
      stopQuizTimer();
      paint();
      var form = qs('#quiz-form');
      if (form && !State.view.submitted) {
        toast('Time is up. Your answers are being sent.', 'error');
        submitQuiz(form, qs('button[type=submit]', form));
      }
      return;
    }
    paint();
  }, 1000);
}

Actions['quiz-submit'] = function (form) {
  submitQuiz(form, qs('button[type=submit]', form));
};

function submitQuiz(form, button) {
  if (State.view.submitted) return;
  State.view.submitted = true;
  stopQuizTimer();
  var answers = {};
  (State.view.attempt.questions || []).forEach(function (q) {
    var checked = qs('input[name="' + q.questionId + '"]:checked', form);
    if (checked) { answers[q.questionId] = checked.value; return; }
    var field = qs('input[type=text][name="' + q.questionId + '"], textarea[name="' + q.questionId + '"]', form);
    answers[q.questionId] = field ? field.value : '';
  });
  busy(button, true, 'Sending…');
  api('my.submitQuiz', { attemptId: State.view.attempt.attemptId, answers: answers }, State.view.quizRequestId)
    .then(function (data) { renderQuizResult(data); })
    .catch(function (error) {
      State.view.submitted = false;
      busy(button, false);
      qs('#quiz-msg').innerHTML = '<div class="notice error">' + esc(error.message) + '</div>';
    });
}

function renderQuizResult(data) {
  var head = data.resultVisible
    ? pageHead('Quiz result', 'Score ' + num(data.score, 0) + ' of ' + num(data.maxScore, 0) + ' (' + num(data.percentage, 0) + '%)',
        '<a class="btn secondary" href="#/practice">Back to practice</a>')
    : pageHead('Quiz handed in', 'Attempt ' + num(data.attemptNumber, 1) + ' recorded.',
        '<a class="btn secondary" href="#/practice">Back to practice</a>');

  var body = data.resultVisible
    ? meter(data.percentage) +
      '<div class="section"><h2>Review</h2>' +
      (data.review || []).map(function (r, i) {
        var mark = r.correct === true ? '<span class="badge published">Correct</span>'
          : (r.correct === null ? '<span class="badge draft">Teacher marks this</span>' : '<span class="badge archived">Not correct</span>');
        return '<div class="card" style="margin-bottom:10px"><div class="spread"><strong>Question ' + (i + 1) + '</strong>' + mark + '</div>' +
          '<p class="small">' + esc(r.question) + '</p>' +
          '<p class="small muted">Your answer: ' + esc(r.yourAnswer || '—') + ' · ' + num(r.awarded, 0) + '/' + num(r.points, 0) + ' points</p>' +
          (r.explanation ? '<p class="small">' + esc(r.explanation) + '</p>' : '') + '</div>';
      }).join('') + '</div>'
    : '<div class="notice">' + esc(data.message || 'Your work has been recorded.') + '</div>';

  setView(head + body);
}

/* --- Student progress --------------------------------------------------- */
function viewStudentProgress() {
  showLoading();
  Promise.all([api('my.progress', {}), api('my.quizResults', { pageSize: 20 })]).then(function (res) {
    var p = res[0];
    var quizRows = res[1].items || [];
    var skills = (p.skills || []).filter(function (s) { return s.total > 0; });

    var skillHtml = skills.length
      ? '<div class="barlist">' + skills.map(function (s) {
          return barRow(titleCase(s.skill), s.percent, s.completed + '/' + s.total);
        }).join('') + '</div>'
      : '<p class="small muted">No learning data available yet.</p>';

    var quizHtml = quizRows.length
      ? '<div class="tablewrap"><table class="responsive"><thead><tr><th>Quiz</th><th>Attempt</th><th>Score</th><th>Percent</th><th>Date</th></tr></thead><tbody>' +
        quizRows.map(function (q) {
          return '<tr>' +
            '<td data-label="Quiz">' + esc(q.quizTitle) + '</td>' +
            '<td data-label="Attempt">' + num(q.attemptNumber, 1) + '</td>' +
            '<td data-label="Score">' + (q.resultVisible ? num(q.score, 0) + ' / ' + num(q.maxScore, 0) : 'Held by teacher') + '</td>' +
            '<td data-label="Percent">' + (q.resultVisible ? num(q.percentage, 0) + '%' : '—') + '</td>' +
            '<td data-label="Date">' + esc(fmtDate(q.submittedAt, true)) + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>'
      : '<p class="small muted">No quiz attempts yet.</p>';

    var achievements = p.achievements || [];
    var achHtml = achievements.length
      ? '<div class="grid cols-3">' + achievements.map(function (a) {
          return '<div class="card"><strong>' + esc(a.title) + '</strong>' +
            '<p class="small muted">' + esc(a.description) + '</p>' +
            '<p class="small muted">' + esc(fmtDate(a.awardedAt)) + '</p></div>';
        }).join('') + '</div>'
      : '<p class="small muted">Keep working — achievements appear as you finish lessons and hand in work.</p>';

    setView(
      pageHead('Progress', 'Everything recorded from your actual work.') +
      '<div class="grid cols-4">' +
        statCard('Lessons completed', p.lessons.completed + ' / ' + p.lessons.total, num(p.lessons.percent, 0) + '%') +
        statCard('Assignments handed in', p.assignments.submitted + ' / ' + p.assignments.total, num(p.assignments.percent, 0) + '%') +
        statCard('Quiz attempts', String(num(p.quizzes.attempts, 0)), p.quizzes.attempts ? 'Average ' + num(p.quizzes.averagePercent, 0) + '%' : '') +
        statCard('Average released grade', p.gradedAverage ? String(num(p.gradedAverage, 0)) : '—') +
      '</div>' +
      '<div class="section"><h2>Skills</h2>' + skillHtml + '</div>' +
      '<div class="section"><h2>Quiz results</h2>' + quizHtml + '</div>' +
      '<div class="section"><h2>Achievements</h2>' + achHtml + '</div>'
    );
  }).catch(showError);
}

/* --- Start ------------------------------------------------------------- */
boot();
</script>
</body>
</html>
