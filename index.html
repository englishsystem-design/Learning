<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="English learning platform for vocational high schools.">
<title>SMK English — Learning Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  /* surfaces */
  --bg:#F3F6FB;
  --paper:#FFFFFF;
  --panel:#F8FAFD;
  --line:#E4EAF2;
  --line-strong:#D2DBE8;

  /* ink */
  --ink:#122B4F;
  --ink-deep:#0C1F3C;
  --ink-soft:#1E3F6B;
  --text:#1C2B3E;
  --muted:#65748A;

  /* accents */
  --blue:#2563C7;
  --blue-soft:#E8F0FD;
  --green:#1E8E63;
  --green-soft:#E6F5EE;
  --purple:#6A4FC4;
  --purple-soft:#EEEAFB;
  --amber:#B4740E;
  --amber-soft:#FCF1DE;
  --rose:#B03A44;
  --rose-soft:#FBECEE;

  --r-sm:8px;
  --r:12px;
  --r-lg:16px;
  --radius:12px;
  --ring:0 0 0 3px rgba(37,99,199,.18);
  --shadow-1:0 1px 2px rgba(18,43,79,.06),0 1px 3px rgba(18,43,79,.04);
  --shadow-2:0 8px 28px rgba(18,43,79,.12);
  --shadow:var(--shadow-2);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  font-size:15px;line-height:1.55;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--sans);font-weight:600;color:var(--ink);margin:0 0 .4em;line-height:1.3;letter-spacing:-.011em}
h1{font-size:1.5rem}
h2{font-size:1.12rem}
h3{font-size:1rem}
p{margin:0 0 .8em;max-width:72ch}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none;vertical-align:-3px}
svg.ic.lg{width:20px;height:20px}

/* ---------- top bar ---------- */
.topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.topbar-inner{max-width:1240px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:20px;min-height:62px}
.wordmark{display:flex;align-items:center;gap:10px;font-size:1.02rem;font-weight:600;color:#fff;text-decoration:none;white-space:nowrap;letter-spacing:-.01em}
.wordmark .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#2EA57C,#2563C7);display:grid;place-items:center;flex:none}
.wordmark .mark svg{width:17px;height:17px;stroke:#fff;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wordmark b{font-weight:600;display:block;line-height:1.15}
.wordmark span{display:block;font-size:.66rem;font-weight:400;color:#9DB5D4;letter-spacing:.04em}
.mainnav{display:flex;gap:2px;flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.mainnav::-webkit-scrollbar{display:none}
.mainnav a{
  display:flex;align-items:center;gap:7px;color:#C2D3E8;text-decoration:none;padding:7px 10px;border-radius:8px;
  font-size:.845rem;font-weight:500;white-space:nowrap;
}
.mainnav a svg{opacity:.75}
.mainnav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.mainnav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.14)}
.mainnav a[aria-current="page"] svg{opacity:1}
.navtoggle{display:none;background:none;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;padding:7px 10px;font-size:.85rem;cursor:pointer}
.profilewrap{position:relative}
.profilebtn{
  display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  color:#fff;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font:inherit;font-size:.84rem;text-align:left;
}
.profilebtn:hover{background:rgba(255,255,255,.14)}
.profilebtn .who2{display:block;line-height:1.2}
.profilebtn .who2 small{display:block;font-size:.68rem;color:#9DB5D4}
.avatar{width:30px;height:30px;border-radius:50%;background:#5E8FD0;color:#fff;display:grid;place-items:center;font-weight:600;font-size:.78rem;flex:none}
.profilemenu{
  position:absolute;right:0;top:calc(100% + 10px);background:var(--paper);color:var(--text);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow-2);min-width:240px;padding:8px;display:none
}
.profilemenu.open{display:block}
.profilemenu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.profilemenu .who strong{display:block;font-size:.93rem;color:var(--ink)}
.profilemenu .who small{color:var(--muted)}
.profilemenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:.88rem;color:var(--text)}
.profilemenu button:hover{background:var(--panel)}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:24px 22px 80px;scroll-margin-top:80px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{margin:0}
.pagehead p{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.pagehead .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.side{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-1)}
.card h3{margin-bottom:.3em}
.card .lead{font-size:1.75rem;font-weight:650;color:var(--ink);line-height:1.1;letter-spacing:-.02em}
.card .label{color:var(--muted);font-size:.8rem}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.cardhead h3{margin:0}
.section{margin-top:26px}
.section > h2{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);color:#fff;margin-bottom:20px;
  background:linear-gradient(115deg,#123B74 0%,#1C5AA8 55%,#2E7FC4 100%);
  box-shadow:var(--shadow-1);
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(520px 200px at 88% -10%,rgba(255,255,255,.22),transparent 70%);
}
.hero .hero-inner{position:relative;z-index:1;display:flex;justify-content:space-between;gap:26px;flex-wrap:wrap;padding:26px 28px}
.hero h1{color:#fff;font-size:1.6rem;margin:0}
.hero p{color:#D7E6F7;margin:6px 0 0;font-size:.92rem;max-width:52ch}
.hero .quote{
  align-self:center;max-width:250px;font-size:.92rem;line-height:1.5;color:#EAF2FB;
  border-left:2px solid rgba(255,255,255,.45);padding-left:14px;
}
.hero .heroprog{margin-top:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:12px 14px;max-width:360px}
.hero .heroprog .spread{margin-bottom:8px;font-size:.85rem;color:#E4EFFA}
.hero .heroprog .meter{background:rgba(255,255,255,.25);height:8px;margin:0}
.hero .heroprog .meter > span{background:#5FD3A1}

/* ---------- stat cards ---------- */
.stat{display:flex;align-items:center;gap:14px}
.stat .tile{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue)}
.stat .tile svg{width:20px;height:20px}
.stat.green .tile{background:var(--green-soft);color:var(--green)}
.stat.purple .tile{background:var(--purple-soft);color:var(--purple)}
.stat.amber .tile{background:var(--amber-soft);color:var(--amber)}
.stat.rose .tile{background:var(--rose-soft);color:var(--rose)}
.stat .lead{font-size:1.55rem}

/* ---------- list rows ---------- */
.listrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border-bottom:0}
.listrow .tile{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue)}
.listrow .tile.green{background:var(--green-soft);color:var(--green)}
.listrow .tile.purple{background:var(--purple-soft);color:var(--purple)}
.listrow .tile.amber{background:var(--amber-soft);color:var(--amber)}
.listrow .grow{flex:1;min-width:0}
.listrow .grow strong{display:block;font-weight:550;font-size:.91rem;color:var(--ink)}
.listrow .grow small{color:var(--muted);font-size:.8rem}
.listrow .count{font-weight:650;color:var(--ink);font-size:1rem}
.quickacts{display:flex;flex-direction:column;gap:9px}
.quickact{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid transparent;
  font-size:.89rem;font-weight:550;text-decoration:none;cursor:pointer;background:var(--blue);color:#fff;
}
.quickact:hover{filter:brightness(1.06)}
.quickact.green{background:var(--green)}
.quickact.purple{background:var(--purple)}
.quickact.plain{background:var(--panel);color:var(--ink);border-color:var(--line-strong)}
.quickact.plain:hover{background:#EFF3F9;filter:none}
.quickact.amber{background:var(--amber)}

/* ---------- controls ---------- */
button,.btn{font:inherit}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--blue);background:var(--blue);color:#fff;
  padding:8px 15px;border-radius:9px;cursor:pointer;font-size:.875rem;font-weight:550;text-decoration:none;
}
.btn:hover{background:#1F55AC;border-color:#1F55AC}
.btn.secondary{background:var(--paper);color:var(--ink);border-color:var(--line-strong)}
.btn.secondary:hover{background:var(--panel)}
.btn.quiet{background:none;border-color:transparent;color:var(--blue);padding:6px 9px}
.btn.quiet:hover{background:var(--blue-soft)}
.btn.danger{background:var(--paper);color:var(--rose);border-color:#E3C3C7}
.btn.danger:hover{background:var(--rose-soft)}
.btn.small{padding:5px 11px;font-size:.8rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label{display:block;font-size:.83rem;font-weight:550;color:var(--ink);margin-bottom:5px}
input,select,textarea{
  width:100%;font:inherit;font-size:.92rem;padding:9px 11px;border:1px solid var(--line-strong);
  border-radius:9px;background:var(--paper);color:var(--text)
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
textarea{min-height:100px;resize:vertical;line-height:1.55}
input[type=file]{padding:7px;background:var(--panel)}
input[type=checkbox],input[type=radio]{width:auto}
.field{margin-bottom:14px}
.field .hint,.hint{font-size:.78rem;color:var(--muted);margin-top:4px}
.fieldrow{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fieldrow.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.checkline{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.checkline label{margin:0;font-weight:400;font-size:.88rem;color:var(--text)}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px;box-shadow:var(--shadow-1)}
.filterbar .field{margin:0;min-width:150px;flex:1}

/* ---------- tables ---------- */
.tablewrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-1)}
.imptable td{padding:7px 8px}
.imptable th{padding:9px 8px}
.imptable input{padding:6px 8px;font-size:.85rem}
.imptable td.rownum{color:var(--muted);font-variant-numeric:tabular-nums;width:28px}
.impsteps{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.impstep{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--text)}
.impstep .n{width:20px;height:20px;border-radius:50%;background:var(--panel);border:1px solid var(--line-strong);
  display:grid;place-items:center;font-size:.72rem;font-weight:650;color:var(--muted);flex:none;margin-top:1px}
.impsummary{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.impsummary .n2{font-size:1.3rem;font-weight:650;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:.885rem}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--panel);color:var(--muted);font-weight:600;font-size:.76rem;letter-spacing:.02em}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFCFE}
td .btn{margin-right:4px}
td.rowacts{white-space:nowrap}

/* ---------- badges & feedback ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.73rem;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.published,.badge.active,.badge.graded,.badge.completed{background:var(--green-soft);color:var(--green);border-color:#C8E6D8}
.badge.draft,.badge.in_progress,.badge.submitted{background:var(--amber-soft);color:var(--amber);border-color:#EEDCBC}
.badge.archived,.badge.inactive,.badge.not_submitted,.badge.not_started{background:#EDF1F6;color:var(--muted);border-color:var(--line)}
.badge.info{background:var(--blue-soft);color:var(--blue);border-color:#CADEF8}
.notice{border:1px solid #CADEF8;border-left:3px solid var(--blue);background:var(--blue-soft);padding:12px 15px;border-radius:10px;font-size:.88rem;margin-bottom:16px}
.notice.warn{border-color:#EEDCBC;border-left-color:var(--amber);background:var(--amber-soft)}
.notice.error{border-color:#EFD2D6;border-left-color:var(--rose);background:var(--rose-soft)}
.empty{background:var(--paper);border:1px dashed var(--line-strong);border-radius:var(--r);padding:40px 24px;text-align:center}
.empty h3{margin-bottom:.2em}
.empty p{margin:0 auto .9em;color:var(--muted);max-width:46ch}
.loading{padding:44px;text-align:center;color:var(--muted);font-size:.9rem}
.meter{height:7px;background:#E7ECF3;border-radius:999px;overflow:hidden;margin-top:6px}
.meter > span{display:block;height:100%;background:var(--green);border-radius:999px}
.meter.blue > span{background:var(--blue)}
.meter.purple > span{background:var(--purple)}
.meter.amber > span{background:var(--amber)}
.barlist{display:flex;flex-direction:column;gap:13px}
.barlist .barrow{display:grid;grid-template-columns:140px 1fr 52px;gap:12px;align-items:center;font-size:.85rem}
.barlist .track{height:8px;background:#E7ECF3;border-radius:999px;overflow:hidden}
.barlist .track > span{display:block;height:100%;border-radius:999px;background:var(--blue)}
.barlist .barrow:nth-child(4n+2) .track > span{background:var(--green)}
.barlist .barrow:nth-child(4n+3) .track > span{background:var(--purple)}
.barlist .barrow:nth-child(4n+4) .track > span{background:var(--amber)}
.barlist .barrow .val{text-align:right;font-weight:600;color:var(--ink)}

/* ---------- toast & modal ---------- */
#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow-2);font-size:.87rem;max-width:340px}
.toast.error{background:var(--rose)}
.toast.success{background:var(--green)}
.modal-backdrop{position:fixed;inset:0;background:rgba(12,31,60,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow-2);width:100%;max-width:640px}
.modal.wide{max-width:920px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:1.05rem}
.modal .body{padding:22px}
.modal footer{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--panel);border-radius:0 0 var(--r-lg) var(--r-lg)}
.iconbtn{background:none;border:0;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px}
.iconbtn:hover{background:var(--panel)}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.auth .brandside{background:linear-gradient(150deg,#0C1F3C 0%,#143A70 60%,#1B569F 100%);color:#fff;padding:60px 52px;display:flex;flex-direction:column;justify-content:center}
.auth .brandside h1{color:#fff;font-size:2.2rem;max-width:13ch;letter-spacing:-.02em}
.auth .brandside p{color:#C3D6EC;max-width:42ch}
.auth .brandside ul{list-style:none;padding:0;margin:30px 0 0;color:#D3E2F2;font-size:.9rem}
.auth .brandside li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.14)}
.auth .formside{display:flex;align-items:center;justify-content:center;padding:48px 24px;background:var(--bg)}
.auth .formside .box{width:100%;max-width:392px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px;box-shadow:var(--shadow-1)}

/* ---------- lesson reading ---------- */
.lessonblock{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-1)}
.lessonblock .kind{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;font-weight:600;color:var(--blue);
  background:var(--blue-soft);border-radius:999px;padding:3px 10px;margin-bottom:10px}
.lessonblock .text{white-space:pre-wrap;font-family:var(--serif);font-size:1.04rem;line-height:1.7;max-width:70ch;color:#22384F}

/* ---------- lesson builder ---------- */
.builderblock{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-1)}
.builderblock .bhead{display:flex;gap:9px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.builderblock .bhead select{max-width:190px}
.builderblock .bnum{font-variant-numeric:tabular-nums;font-weight:650;color:var(--muted);font-size:.82rem;width:22px;flex:none}
.builderblock .btile{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue)}
.vocabgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vocabcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-1)}
.vocabcard .term{font-size:1.06rem;color:var(--ink);font-weight:600}

/* ---------- quiz ---------- */
.quizq{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-1);max-width:920px}
.quizq .qtext{font-size:1.02rem;font-weight:550;color:var(--ink);margin-bottom:14px;line-height:1.5}
.optline{display:flex;gap:11px;align-items:center;padding:11px 13px;border:1px solid var(--line-strong);border-radius:10px;margin-bottom:9px;cursor:pointer;background:var(--paper);font-weight:400;font-size:.94rem;color:var(--text)}
.optline:hover{border-color:#A9C4EA;background:#FBFDFF}
.optline .optkey{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;
  font-size:.78rem;font-weight:600;color:var(--muted);flex:none;background:var(--panel)}
.optline input{width:auto;position:absolute;opacity:0;pointer-events:none}
.optline.selected,.optline:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.optline.selected .optkey,.optline:has(input:checked) .optkey{background:var(--green);border-color:var(--green);color:#fff}
.optline:has(input:focus-visible){box-shadow:var(--ring)}
.quizbar{max-width:920px;display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 16px;margin-bottom:16px;box-shadow:var(--shadow-1)}
.quizbar .track{flex:1;height:7px;background:#E7ECF3;border-radius:999px;overflow:hidden}
.quizbar .track > span{display:block;height:100%;background:var(--blue);border-radius:999px}
.timer{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink);
  background:var(--amber-soft);border:1px solid #EEDCBC;border-radius:999px;padding:5px 12px;font-size:.88rem}

/* ---------- ai, tabs, pager ---------- */
.aipanel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-1)}
.aiout{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;font-size:.92rem;line-height:1.65;max-height:420px;overflow:auto}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);
  border-radius:999px;padding:5px;width:fit-content;max-width:100%;box-shadow:var(--shadow-1)}
.tabs button{background:none;border:0;padding:8px 16px;border-radius:999px;cursor:pointer;font:inherit;font-size:.87rem;color:var(--muted);font-weight:500}
.tabs button:hover{color:var(--ink);background:var(--panel)}
.tabs button[aria-selected="true"]{color:#fff;background:var(--ink);font-weight:550}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:.85rem;color:var(--muted);flex-wrap:wrap;gap:10px}

@media (min-width:761px){
  .mainnav a svg{display:none}
  .mainnav a{gap:0}
}
@media (max-width:1040px){
  .grid.side{grid-template-columns:1fr}
}
@media (max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth .brandside{padding:40px 28px}
  .auth .brandside h1{font-size:1.8rem}
  .grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero .quote{display:none}
}
@media (max-width:760px){
  .navtoggle{display:inline-flex;order:2;margin-left:auto}
  .profilewrap{order:3}
  .profilebtn .who2{display:none}
  .mainnav{order:4;flex-basis:100%;flex-direction:column;display:none;padding-bottom:12px;overflow:visible;flex-wrap:wrap}
  .mainnav a svg{display:block}
  .mainnav.open{display:flex}
  .mainnav a{padding:11px 10px;border-radius:8px}
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}
  .fieldrow,.fieldrow.three{grid-template-columns:1fr}
  main{padding:18px 14px 64px}
  .hero .hero-inner{padding:22px 20px}
  .hero h1{font-size:1.32rem}
  h1{font-size:1.32rem}
  table.responsive thead{display:none}
  table.responsive tr{display:block;border-bottom:1px solid var(--line);padding:12px 14px}
  table.responsive tr:hover{background:transparent}
  table.responsive td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0}
  table.responsive td::before{content:attr(data-label);font-weight:600;color:var(--muted);font-size:.78rem}
  .barlist .barrow{grid-template-columns:104px 1fr 44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function icon(name, size) {

  return '<svg class="ic' + (size === 'lg' ? ' lg' : '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + body + '</svg>';

function greeting() {
  var h = new Date().getHours();
  if (h < 11) return 'Good morning';
  if (h < 15) return 'Good afternoon';
  if (h < 19) return 'Good evening';
  return 'Good evening';
}
function fmtDate(iso, withTime) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  var opts = { year: 'numeric', month: 'short', day: 'numeric' };
  if (withTime) { opts.hour = '2-digit'; opts.minute = '2-digit'; }
  return d.toLocaleDateString('en-GB', opts);
}
function toDatetimeLocal(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function titleCase(s) {
  return String(s || '').toLowerCase().replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
}

function toast(message, kind) {

function fileToBase64(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var result = String(reader.result || '');
      var comma = result.indexOf(',');
      resolve(comma >= 0 ? result.slice(comma + 1) : result);
    };
    reader.onerror = function () { reject(new Error('The file could not be read.')); };
    reader.readAsDataURL(file);
  });
}
function readFileAsText(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () { resolve(String(reader.result || '')); };
    reader.onerror = function () { reject(new Error('The file could not be read.')); };
    reader.readAsText(file, 'utf-8');
  });

/** Minimal RFC 4180 CSV parser: handles quoted fields, escaped quotes and CRLF/LF. */
function parseCsv(text) {
  var rows = [];
  var row = [];
  var field = '';
  var inQuotes = false;
  var s = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (var i = 0; i < s.length; i++) {
    var ch = s[i];
    if (inQuotes) {
      if (ch === '"') {
        if (s[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else {
        field += ch;
      }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === ',') {
      row.push(field); field = '';
    } else if (ch === '\n') {
      row.push(field); field = '';
      rows.push(row); row = [];
    } else {
      field += ch;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) { return !(r.length === 1 && String(r[0]).trim() === ''); });
}
function csvCell_(value) {
  var v = String(value === undefined || value === null ? '' : value);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function toCsv(headers, rows) {
  var lines = [headers.map(csvCell_).join(',')];
  rows.forEach(function (r) { lines.push(headers.map(function (h) { return csvCell_(r[h]); }).join(',')); });
  return lines.join('\r\n');
}
function downloadTextFile(filename, mime, content) {

/** A password that always passes validatePasswordStrength_ on the backend (8+ chars, a letter and a number). */
function generatePassword() {
  var words = ['garden', 'river', 'maple', 'coral', 'summer', 'bright', 'ocean', 'meadow', 'amber', 'cedar'];
  var word = words[Math.floor(Math.random() * words.length)];

/* --- 4. API CLIENT ---------------------------------------------------- */
function ApiError(code, message) { this.code = code; this.message = message; }
ApiError.prototype = Object.create(Error.prototype);

var ERROR_TEXT = {
  AUTH_REQUIRED: 'Sign in to continue.',
  AUTH_INVALID: 'Your session is no longer valid. Sign in again.',
  AUTH_EXPIRED: 'Your session has expired. Sign in again.',
  FORBIDDEN: 'You do not have access to that.',
  INVALID_ACTION: 'That request is not supported.',
  NOT_FOUND: 'That item no longer exists.',
  VALIDATION_ERROR: 'Check the form and try again.',
  DUPLICATE: 'That already exists.',
  CONFLICT: 'Someone changed this at the same time. Reload and try again.',
  RATE_LIMITED: 'You have reached the limit for now.',
  AI_DISABLED: 'The AI assistant is switched off.',
  AI_NOT_CONFIGURED: 'The AI assistant is not configured.',
  AI_TIMEOUT: 'The AI assistant did not respond.',
  AI_PROVIDER_ERROR: 'The AI assistant is unavailable.',
  AI_QUOTA_EXCEEDED: 'The AI daily limit has been reached.',
  STORAGE_ERROR: 'The file could not be stored.',
  DATABASE_ERROR: 'The database is unavailable.',
  INTERNAL_ERROR: 'Something went wrong on the server.',
  NETWORK_ERROR: 'The server cannot be reached. Check your connection and the API address.',
  TIMEOUT: 'The server took too long to answer.'

/**
 * Single entry point for every backend call.
 * text/plain keeps the request CORS-simple, so no preflight is needed.
 */
function api(action, params, requestId) {
  if (!API_BASE_URL || API_BASE_URL.indexOf('PASTE_YOUR') === 0) {
    return Promise.reject(new ApiError('NETWORK_ERROR', 'The API address has not been set in index.html.'));
  }
  var controller = new AbortController();
  var timer = setTimeout(function () { controller.abort(); }, APP.timeoutMs);
  var body = JSON.stringify({
    action: action,
    token: State.token || '',
    requestId: requestId || uuid(),
    params: params || {}
  });

  return fetch(API_BASE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: body,
    redirect: 'follow',
    signal: controller.signal
  })
    .then(function (response) {
      clearTimeout(timer);
      return response.text().then(function (text) {
        var payload;
        try { payload = JSON.parse(text); }
        catch (e) { throw new ApiError('INTERNAL_ERROR', 'The server returned an unreadable response.'); }
        if (!payload || typeof payload !== 'object') {
          throw new ApiError('INTERNAL_ERROR', ERROR_TEXT.INTERNAL_ERROR);

        if (payload.success) return payload.data || {};
        var code = (payload.error && payload.error.code) || 'INTERNAL_ERROR';
        var message = (payload.error && payload.error.message) || ERROR_TEXT[code] || ERROR_TEXT.INTERNAL_ERROR;
        if (code === 'AUTH_EXPIRED' || code === 'AUTH_INVALID' || code === 'AUTH_REQUIRED') {
          endSession(message);
        }
        throw new ApiError(code, message);
      });
    })
    .catch(function (error) {
      clearTimeout(timer);
      if (error instanceof ApiError) throw error;
      if (error && error.name === 'AbortError') throw new ApiError('TIMEOUT', ERROR_TEXT.TIMEOUT);
      throw new ApiError('NETWORK_ERROR', ERROR_TEXT.NETWORK_ERROR);
    });
}

function endSession(message) {
  State.token = null;
  State.user = null;
  try { localStorage.removeItem(APP.storageKey); } catch (e) {}
  closeModal();
  renderLogin(message || 'Sign in to continue.');
}

function pagerHtml(result, actName) {
  if (!result || result.total <= result.pageSize) return '';
  var from = (result.page - 1) * result.pageSize + 1;
  var to = Math.min(result.total, result.page * result.pageSize);
  return '<div class="pager"><span>Showing ' + from + '–' + to + ' of ' + result.total + '</span><span>' +
    '<button class="btn secondary small" data-act="' + esc(actName) + '" data-page="' + (result.page - 1) + '"' + (result.page <= 1 ? ' disabled' : '') + '>Previous</button> ' +
    '<button class="btn secondary small" data-act="' + esc(actName) + '" data-page="' + (result.page + 1) + '"' + (result.hasNext ? '' : ' disabled') + '>Next</button>' +
    '</span></div>';

/* --- 7. MODAL --------------------------------------------------------- */
var modalLastFocus = null;
function openModal(title, bodyHtml, footerHtml, wide) {
  modalLastFocus = document.activeElement;
  qs('#modal-root').innerHTML =
    '<div class="modal-backdrop">' +
      '<div class="modal' + (wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
        '<header><h2>' + esc(title) + '</h2><button class="iconbtn" data-act="close-modal" aria-label="Close">&times;</button></header>' +
        '<div class="body">' + bodyHtml + '</div>' +
        (footerHtml ? '<footer>' + footerHtml + '</footer>' : '') +
      '</div>' +
    '</div>';
  /* Closing on a backdrop click is wired directly here, not through the [data-act]
     delegation below. That delegation walks up with closest() and would otherwise
     match this wrapper for every plain element inside the modal (a <label>, a bare
     checkbox, anything with no data-act of its own) and call preventDefault() on it
     before this handler even runs — silently cancelling things like a file <label>
     opening its picker. */
  var backdrop = qs('.modal-backdrop');
  if (backdrop) {
    backdrop.addEventListener('click', function (event) {
      if (event.target === backdrop) closeModal();
    });
  }
  var first = qs('#modal-root input, #modal-root select, #modal-root textarea, #modal-root button');
  if (first) first.focus();
}
function closeModal() {
  qs('#modal-root').innerHTML = '';
  if (modalLastFocus && modalLastFocus.focus) { try { modalLastFocus.focus(); } catch (e) {} }
  modalLastFocus = null;
}
function formValues(form) {
  var out = {};
  qsa('input,select,textarea', form).forEach(function (el) {
    if (!el.name) return;
    if (el.type === 'checkbox') {
      if (el.dataset.multi === 'true') {
        if (!Array.isArray(out[el.name])) out[el.name] = [];
        if (el.checked) out[el.name].push(el.value);
      } else out[el.name] = el.checked;
    } else if (el.type === 'radio') {
      if (el.checked) out[el.name] = el.value;
    } else if (el.type !== 'file') {
      out[el.name] = el.value;
    }
  });
  return out;
}
function busy(el, isBusy, busyLabel) {
  if (!el) return;
  if (isBusy) {
    el.dataset.label = el.textContent;
    el.textContent = busyLabel || 'Working…';
    el.disabled = true;
  } else {
    if (el.dataset.label) el.textContent = el.dataset.label;
    el.disabled = false;
  }
}

function doLogin(form) {
  var values = formValues(form);
  var button = qs('button[type=submit]', form);
  var box = qs('#login-error');
  box.innerHTML = '';
  if (!values.email || !values.password) {
    box.innerHTML = '<div class="notice error">Enter your email and password.</div>';
    return;
  }
  busy(button, true, 'Signing in…');
  api('auth.login', { email: values.email, password: values.password })
    .then(function (data) {
      State.token = data.token;
      State.user = data.user;
      try { localStorage.setItem(APP.storageKey, data.token); } catch (e) {}
      startApp();
    })
    .catch(function (error) {
      busy(button, false);
      box.innerHTML = '<div class="notice error">' + esc(error.message) + '</div>';
    });
}

/* --- 9. BOOT AND ROUTER ----------------------------------------------- */
function boot() {
  var stored = null;
  try { stored = localStorage.getItem(APP.storageKey); } catch (e) {}
  if (!stored) { renderLogin(); return; }
  State.token = stored;
  api('auth.me', {})
    .then(function (data) {
      State.user = data.user;      // role and identity come from the backend, never from storage
      startApp();
    })
    .catch(function (error) {
      if (error.code === 'NETWORK_ERROR' || error.code === 'TIMEOUT') {
        renderLogin(error.message);
      } else if (!State.user) {
        renderLogin();
      }
    });
}

function startApp() {
  renderShell();
  loadAiStatus();
  var home = State.user.role === 'TEACHER' ? '#/dashboard' : '#/home';
  if (!location.hash || location.hash === '#' || location.hash === '#/') {
    location.hash = home;          // triggers the router through hashchange
  } else {
    route();
  }
  State.booted = true;
}

function parseHash() {
  var raw = (location.hash || '').replace(/^#\/?/, '');
  var parts = raw.split('/').filter(function (p) { return p !== ''; });
  return { name: parts[0] || '', id: parts[1] || '', sub: parts[2] || '' };
}

/* A view function calls showLoading() then, once its api() promise resolves, calls setView()
   with the final HTML. If the user navigates away before that promise resolves, the late
   response must not overwrite whatever the newer page has already rendered. PendingViewHash
   is stamped once per route() dispatch (covering async view renders and the synchronous
   "page not found"/error paths below equally); setView() silently skips a stale paint instead
   of fighting the current page for control of the DOM. */
var PendingViewHash = null;

function route() {
  if (!State.user) { renderLogin(); return; }
  var r = parseHash();
  PendingViewHash = location.hash || '';
  setActiveNav(location.hash || '');
  var table = State.user.role === 'TEACHER' ? TEACHER_ROUTES : STUDENT_ROUTES;
  var handler = table[r.name];
  if (!handler) {
    setView(emptyState('Page not found', 'That page does not exist for your account.',
      '<a class="btn" href="' + (State.user.role === 'TEACHER' ? '#/dashboard' : '#/home') + '">Go to start</a>'));
    return;
  }
  State.view = {};
  closeModal();
  qs('.mainnav') && qs('.mainnav').classList.remove('open');
  try {
    handler(r);
  } catch (e) {
    showError(new ApiError('INTERNAL_ERROR', 'This page could not be opened.'));
  }
}

window.addEventListener('hashchange', route);

/* --- 10. GLOBAL EVENT DELEGATION -------------------------------------- */
document.addEventListener('click', function (event) {
  var target = event.target.closest('[data-act]');
  if (!target) {
    var menu = qs('#profilemenu');
    if (menu && menu.classList.contains('open')) {
      menu.classList.remove('open');
      var pb = qs('.profilebtn'); if (pb) pb.setAttribute('aria-expanded', 'false');
    }
    return;
  }
  var act = target.getAttribute('data-act');
  if (target.tagName === 'FORM') return;
  var handler = Actions[act];
  if (!handler) return;
  event.preventDefault();
  handler(target, event);
});

document.addEventListener('submit', function (event) {
  var form = event.target.closest('form[data-act]');
  if (!form) return;
  event.preventDefault();
  var handler = Actions[form.getAttribute('data-act')];
  if (handler) handler(form, event);
});

document.addEventListener('keydown', function (event) {
  if (event.key === 'Escape' && qs('.modal-backdrop')) closeModal();
});

/* Highlights the chosen option row and keeps the quiz progress bar in step.
   Selection is cosmetic only; the backend scores the attempt. */
document.addEventListener('change', function (event) {
  var input = event.target;
  if (!input || input.type !== 'radio') return;
  var row = input.closest('.optline');
  if (row) {
    qsa('input[name="' + (window.CSS && CSS.escape ? CSS.escape(input.name) : input.name) + '"]')
      .forEach(function (other) {
        var r = other.closest('.optline');
        if (r) r.classList.toggle('selected', other.checked);
      });
  }
  updateQuizProgress();
});
document.addEventListener('input', function (event) {
  if (event.target.closest('#quiz-form')) updateQuizProgress();
});
function updateQuizProgress() {
  var form = qs('#quiz-form');
  var bar = qs('#quiz-progress');
  if (!form || !bar) return;
  var total = num(bar.getAttribute('data-total'), 0);
  if (total <= 0) return;
  var names = {};
  qsa('[name]', form).forEach(function (el) {
    if (el.type === 'radio') { if (el.checked) names[el.name] = true; }
    else if (String(el.value || '').trim()) names[el.name] = true;
  });
  var answered = Object.keys(names).length;
  var fill = qs('span', bar.querySelector('.track'));
  if (fill) fill.style.width = pct(answered / total * 100) + '%';
  var label = qs('#quiz-progress-label');
  if (label) label.textContent = 'Answered ' + answered + ' of ' + total;
}

Actions['ai-run'] = function (form) {

    .then(function (data) {

        '<div class="small muted" style="margin-bottom:6px">Model ' + esc(data.model) + ' · ' + esc(data.remainingToday) + ' requests left today</div>';
      out.appendChild(pre);

    .catch(function (error) {

      statCard('Active classes', c.classes, null, 'blue', 'users') +

      perfCard += '<p class="small muted">Create a class and enrol students to see progress here.</p>' +

    var data = results[0];
    var classes = results[1];

    State.view.lesson = l;
    State.view.blocks = data.blocks.map(function (b) { return { id: b.id, type: b.type, title: b.title, content: b.content, fileId: b.fileId, fileName: b.fileName, fileUrl: b.fileUrl }; });

    var html = pageHead(l.title, (l.unitTitle || '') + ' · ' + titleCase(l.skill),
      '<a class="btn secondary" href="#/lessons">All lessons</a>' +

function syncBlockFields() {
  qsa('[data-block-field]').forEach(function (el) {
    var index = num(el.getAttribute('data-index'), -1);
    var field = el.getAttribute('data-block-field');
    if (index >= 0 && State.view.blocks[index]) State.view.blocks[index][field] = el.value;
  });
}
Actions['block-add'] = function () {
  syncBlockFields();
  State.view.blocks.push({ id: '', type: 'EXPLANATION', title: 'New block', content: '', fileId: '', fileName: '', fileUrl: '' });
  renderBlocks();
};
Actions['block-remove'] = function (btn) {
  syncBlockFields();
  State.view.blocks.splice(num(btn.getAttribute('data-index'), 0), 1);
  renderBlocks();
};
Actions['block-up'] = function (btn) {
  syncBlockFields();
  var i = num(btn.getAttribute('data-index'), 0);
  if (i > 0) { var t = State.view.blocks[i - 1]; State.view.blocks[i - 1] = State.view.blocks[i]; State.view.blocks[i] = t; }
  renderBlocks();
};
Actions['block-down'] = function (btn) {
  syncBlockFields();
  var i = num(btn.getAttribute('data-index'), 0);
  if (i < State.view.blocks.length - 1) { var t = State.view.blocks[i + 1]; State.view.blocks[i + 1] = State.view.blocks[i]; State.view.blocks[i] = t; }
  renderBlocks();
};
Actions['block-upload'] = function (btn) {
  var index = num(btn.getAttribute('data-index'), 0);
  var input = qs('[data-block-file="' + index + '"]');
  if (!input || !input.files || !input.files.length) { toast('Choose a file first.', 'error'); return; }
  var file = input.files[0];
  if (file.size > APP.maxUploadBytes) { toast('That file is larger than 8 MB.', 'error'); return; }
  syncBlockFields();
  busy(btn, true, 'Uploading…');
  fileToBase64(file).then(function (base64) {
    return api('material.upload', {
      entityType: 'BLOCK', entityId: State.view.lesson.id,
      fileName: file.name, mimeType: file.type || 'application/octet-stream', base64: base64
    });
  }).then(function (data) {
    State.view.blocks[index].fileId = data.material.fileId;
    State.view.blocks[index].fileName = data.material.fileName;
    State.view.blocks[index].fileUrl = data.material.driveUrl;
    renderBlocks();
    toast('File attached. Save the blocks to keep it.', 'success');
  }).catch(function (error) { busy(btn, false); toast(error.message, 'error'); });
};

function viewClassDetail(classId) {
  showLoading();
  Promise.all([api('class.roster', { classId: classId }), api('analytics.class', { classId: classId })])
    .then(function (results) {
      var roster = results[0];
      var stats = results[1];
      State.view.classId = classId;
      var c = roster.klass;
      var html = pageHead(c.name, 'Grade ' + c.grade + ' · ' + titleCase(c.vocational) + ' · ' + c.academicYear,
        '<a class="btn secondary" href="#/classes">All classes</a>' +
        '<button class="btn secondary" data-act="class-enrol">Enrol a student</button>' +
        '<button class="btn secondary" data-act="student-import" data-class="' + esc(classId) + '">' + icon('file') + 'Import students</button>' +
        '<button class="btn" data-act="student-new" data-class="' + esc(classId) + '">New student account</button>');

      html += '<div class="grid cols-3">' +
        statCard('Students', stats.summary.students) +
        statCard('Lessons assigned', stats.summary.lessons) +
        statCard('Lessons completed', pct(stats.summary.lessonCompletionPercent) + '%') +
        '</div>';

      html += '<div class="section"><h2>Students</h2>';
      if (!roster.students.length) {
        html += emptyState('No students in this class', 'Enrol an existing student account or create a new one.',
          '<button class="btn" data-act="class-enrol">Enrol a student</button>');
      } else {
        var byId = {};
        stats.students.forEach(function (s) { byId[s.studentId] = s; });
        html += '<div class="tablewrap"><table class="responsive"><thead><tr>' +
          '<th>Student</th><th>Email</th><th>Lessons</th><th>Submissions</th><th>Quiz average</th><th>Actions</th></tr></thead><tbody>' +
          roster.students.map(function (s) {
            var st = byId[s.id] || {};

              '<td data-label="Email">' + esc(s.email) + '</td>' +
              '<td data-label="Lessons">' + esc(num(st.lessonsCompleted, 0)) + ' / ' + esc(num(st.lessonsAssigned, 0)) + meter(st.lessonPercent) + '</td>' +
              '<td data-label="Submissions">' + esc(num(st.submissions, 0)) + ' / ' + esc(num(st.assignmentsOpen, 0)) + '</td>' +
              '<td data-label="Quiz average">' + (st.quizAveragePercent === '' || st.quizAveragePercent === undefined ? '—' : esc(st.quizAveragePercent) + '%') + '</td>' +
              '<td data-label="Actions">' +
                '<button class="btn secondary small" data-act="student-transfer" data-id="' + esc(s.id) + '">Transfer</button>' +
                '<button class="btn secondary small" data-act="student-reset" data-id="' + esc(s.id) + '">Reset password</button>' +
                '<button class="btn danger small" data-act="student-remove" data-id="' + esc(s.id) + '">Remove</button>' +
              '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }
      html += '</div>';
      setView(html);
    }).catch(showError);

/* --- Bulk student import ------------------------------------------------
   Teacher downloads a CSV template, fills in each student's name, email and
   password themselves (this app never invents credentials on its own), then
   uploads the completed file. Rows are parsed and shown for a final check
   before anything is sent, and the backend validates and creates each row
   independently so one mistake cannot block the rest of the class. */
var IMPORT_HEADERS = ['name', 'email', 'password', 'identityNo'];
var ImportState = null;

function emptyImportRow() { return { name: '', email: '', password: '', identityNo: '' }; }

function matchImportHeaders_(headerRow) {
  var norm = headerRow.map(function (h) { return String(h || '').toLowerCase().replace(/[^a-z0-9]/g, ''); });
  var wants = {
    name: ['name', 'fullname', 'studentname'],
    email: ['email', 'emailaddress'],
    password: ['password', 'startingpassword'],
    identityNo: ['identityno', 'studentnumber', 'nisn', 'nis', 'id']
  };
  var map = {};
  IMPORT_HEADERS.forEach(function (field) {
    var idx = -1;
    wants[field].some(function (candidate) { idx = norm.indexOf(candidate); return idx >= 0; });
    map[field] = idx;
  });
  return map;
}

Actions['student-import'] = function (btn) {

  loadClasses().then(function (classes) {

  });
};

      '<div class="impstep"><span class="n">2</span><span>Choose the class to enrol them in (optional — you can enrol later).</span></div>' +
      '<div class="impstep"><span class="n">3</span><span>Upload the completed file to preview the students, then import.</span></div>' +
    '</div>' +

      '<div class="field" style="margin:0;min-width:200px"><select id="import-class">' + selectOptions(options, ImportState.classId) + '</select></div>' +
      '<label class="btn secondary" for="import-file" style="margin:0">' + icon('plus') + 'Upload completed file' +
        '<input id="import-file" type="file" accept=".csv,text/csv" style="position:absolute;width:1px;height:1px;opacity:0">' +
      '</label>' +

document.addEventListener('change', function (event) {
  var el = event.target;
  if (!ImportState) return;
  if (el.id === 'import-class') { ImportState.classId = el.value; return; }
  if (el.id === 'import-file' && el.files && el.files[0]) {
    var file = el.files[0];
    readFileAsText(file).then(function (text) {
      var table = parseCsv(text);
      if (!table.length) { toast('That file has no rows.', 'error'); return; }
      var map = matchImportHeaders_(table[0]);
      var dataRows = (map.name >= 0 || map.email >= 0) ? table.slice(1) : table;
      if (map.name < 0) map.name = 0;
      if (map.email < 0) map.email = 1;
      if (map.password < 0) map.password = 2;
      if (map.identityNo < 0) map.identityNo = 3;
      var rows = dataRows.map(function (cells) {
        return {
          name: String(cells[map.name] || '').trim(),
          email: String(cells[map.email] || '').trim(),
          password: String(cells[map.password] || '').trim(),
          identityNo: String(cells[map.identityNo] || '').trim()
        };
      }).filter(function (r) { return r.name || r.email; });
      if (rows.length > 200) { toast('Only the first 200 rows were loaded.', 'error'); rows = rows.slice(0, 200); }
      ImportState.rows = rows;
      ImportState.results = null;
      refreshImportBody();
    }).catch(function (error) { toast(error.message, 'error'); });
    return;
  }
  var field = el.getAttribute && el.getAttribute('data-import-field');
  if (field) {
    var idx = num(el.getAttribute('data-index'), -1);
    if (ImportState.rows[idx]) ImportState.rows[idx][field] = el.value;
  }
});

function questionForm(rec) {

  return '<form data-act="question-save"' + (q.id ? ' data-id="' + esc(q.id) + '"' : '') + '>' +
    '<div id="qs-msg"></div>' +
    '<div class="fieldrow">' +
      '<div class="field"><label for="qs-type">Type</label><select id="qs-type" name="type">' +
        selectOptions(QUESTION_TYPES.map(function (t) { return { value: t, label: titleCase(t) }; }), q.type || 'MCQ') + '</select></div>' +
      '<div class="field"><label for="qs-skill">Skill</label><select id="qs-skill" name="skill">' +
        selectOptions(SKILLS.map(function (s) { return { value: s, label: titleCase(s) }; }), q.skill || 'GRAMMAR') + '</select></div>' +
    '</div>' +
    '<div class="field"><label for="qs-question">Question</label>' +
      '<textarea id="qs-question" name="question" rows="3" required maxlength="4000">' + esc(q.question || '') + '</textarea></div>' +
    '<div id="qs-answer">' + questionAnswerFields(q.type || 'MCQ', options, q.correctAnswer || '') + '</div>' +
    '<div class="field"><label for="qs-explanation">Explanation</label>' +
      '<textarea id="qs-explanation" name="explanation" rows="2" maxlength="2000">' + esc(q.explanation || '') + '</textarea></div>' +
    '<div class="fieldrow three">' +
      '<div class="field"><label for="qs-diff">Difficulty</label><select id="qs-diff" name="difficulty">' +
        selectOptions(DIFFICULTIES.map(function (d) { return { value: d, label: titleCase(d) }; }), q.difficulty || 'MEDIUM') + '</select></div>' +
      '<div class="field"><label for="qs-phase">Phase</label><input id="qs-phase" name="phase" maxlength="20" value="' + esc(q.phase || '') + '"></div>' +
      '<div class="field"><label for="qs-grade">Grade</label><input id="qs-grade" name="grade" maxlength="20" value="' + esc(q.grade || '') + '"></div>' +
    '</div>' +
    '<div class="field"><label for="qs-topic">Topic</label><input id="qs-topic" name="topic" maxlength="160" value="' + esc(q.topic || '') + '"></div>' +
    '<button class="btn" type="submit">' + (q.id ? 'Save question' : 'Create question') + '</button>' +
  '</form>';
}

function questionAnswerFields(type, options, correct) {
  if (type === 'MCQ') {
    return '<div class="field"><label>Options and correct answer</label>' +
      '<p class="hint">Fill at least two options, then choose which one is correct.</p>' +
      options.map(function (opt, i) {
        return '<div class="checkline">' +
          '<input type="radio" id="qs-correct-' + i + '" name="correctIndex" aria-label="Option ' + (i + 1) + ' is correct" value="' + i + '"' + (String(correct) !== '' && opt === correct ? ' checked' : (correct === '' && i === 0 ? ' checked' : '')) + '>' +
          '<input type="text" name="option" data-option="' + i + '" maxlength="300" aria-label="Option ' + (i + 1) + ' text" placeholder="Option ' + (i + 1) + '" value="' + esc(opt) + '">' +
        '</div>';
      }).join('') + '</div>';
  }
  if (type === 'TRUE_FALSE') {
    return '<div class="field"><label for="qs-tf">Correct answer</label><select id="qs-tf" name="correctAnswer">' +
      selectOptions([{ value: 'TRUE', label: 'True' }, { value: 'FALSE', label: 'False' }], String(correct || 'TRUE').toUpperCase()) + '</select></div>';
  }
  if (type === 'SHORT_ANSWER') {
    return '<div class="field"><label for="qs-sa">Correct answer</label>' +
      '<input id="qs-sa" name="correctAnswer" maxlength="200" required value="' + esc(correct || '') + '">' +
      '<div class="hint">Matching ignores capital letters and extra spaces.</div></div>';
  }
  return '<div class="notice">This question type is graded by the teacher, so it has no stored answer key.</div>';
}

document.addEventListener('change', function (event) {

  var box = qs('#qs-answer');

});

Actions['question-save'] = function (form) {
  var values = formValues(form);
  var id = form.getAttribute('data-id');
  var button = qs('button[type=submit]', form);
  var payload = {
    type: values.type, skill: values.skill, question: values.question,
    explanation: values.explanation, difficulty: values.difficulty,
    phase: values.phase, grade: values.grade, topic: values.topic,
    options: [], correctAnswer: ''
  };
  if (values.type === 'MCQ') {
    var texts = qsa('[data-option]', form).map(function (el) { return el.value.trim(); });
    var chosen = num(values.correctIndex, 0);
    payload.options = texts.filter(function (t) { return t !== ''; });
    payload.correctAnswer = texts[chosen] || '';
    if (payload.correctAnswer === '') {
      qs('#qs-msg').innerHTML = '<div class="notice error">Select a correct answer that is not empty.</div>';
      return;
    }
  } else {
    payload.correctAnswer = values.correctAnswer || '';
  }
  if (id) payload.id = id;
  busy(button, true, 'Saving…');
  api(id ? 'question.update' : 'question.create', payload)
    .then(function () { closeModal(); toast(id ? 'Question saved.' : 'Question created.', 'success'); viewQuestions(); })
    .catch(function (error) {
      busy(button, false);
      qs('#qs-msg').innerHTML = '<div class="notice error">' + esc(error.message) + '</div>';
    });
};

function viewQuizBuilder(quizId) {
  showLoading();
  Promise.all([
    api('quiz.get', { id: quizId }),
    api('question.list', { status: 'PUBLISHED', pageSize: 200 }),
    api('quiz.results', { quizId: quizId })
  ]).then(function (res) {
    var quiz = res[0].quiz;
    var chosen = res[0].questions || [];
    var bank = res[1].items || [];
    var results = res[2];
    State.view.quiz = quiz;
    State.view.quizQuestions = chosen.map(function (q) { return { questionId: q.questionId, points: num(q.points, 1) }; });
    State.view.quizBank = bank;

    var chosenIds = {};
    chosen.forEach(function (q) { chosenIds[q.questionId] = true; });

    var chosenHtml = chosen.length
      ? chosen.map(function (q, i) {
          return '<div class="builderblock"><div class="bhead">' +
            '<strong>' + (i + 1) + '.</strong> <span class="badge info">' + esc(titleCase(q.type)) + '</span>' +
            '<span class="small muted">' + esc(titleCase(q.skill)) + '</span>' +
            '<span style="margin-left:auto"></span>' +
            '<label class="small muted" for="qp-' + esc(q.questionId) + '">Points</label>' +
            '<input id="qp-' + esc(q.questionId) + '" type="number" min="1" max="100" style="width:80px" data-points="' + esc(q.questionId) + '" value="' + num(q.points, 1) + '">' +
            '<button class="btn small quiet" data-act="quiz-remove-question" data-id="' + esc(q.questionId) + '">Remove</button>' +
          '</div><div class="small">' + esc(q.question) + '</div></div>';
        }).join('')
      : '<p class="small muted">No questions in this quiz yet. Add some from the bank below.</p>';

    var bankHtml = bank.length
      ? bank.filter(function (q) { return !chosenIds[q.id]; }).map(function (q) {
          var text = q.question.length > 110 ? q.question.slice(0, 110) + '…' : q.question;
          return '<div class="builderblock"><div class="bhead">' +
            '<span class="badge info">' + esc(titleCase(q.type)) + '</span>' +
            '<span class="small muted">' + esc(titleCase(q.skill)) + ' · ' + esc(titleCase(q.difficulty)) + '</span>' +
            '<span style="margin-left:auto"></span>' +
            '<button class="btn small secondary" data-act="quiz-add-question" data-id="' + esc(q.id) + '">Add</button>' +
          '</div><div class="small">' + esc(text) + '</div></div>';
        }).join('') || '<p class="small muted">Every published question is already in this quiz.</p>'
      : emptyState('No published questions', 'Publish questions in the question bank before building a quiz.',
          '<a class="btn" href="#/questions">Go to question bank</a>');

    var attempts = results.attempts || [];
    var resultsHtml = attempts.length
      ? '<div class="tablewrap"><table class="responsive"><thead><tr><th>Student</th><th>Attempt</th><th>Score</th><th>Percent</th><th>Submitted</th></tr></thead><tbody>' +
        attempts.map(function (a) {
          return '<tr>' +
            '<td data-label="Student">' + esc(a.studentName) + '</td>' +
            '<td data-label="Attempt">' + num(a.attemptNumber, 1) + '</td>' +
            '<td data-label="Score">' + num(a.score, 0) + ' / ' + num(a.maxScore, 0) + '</td>' +
            '<td data-label="Percent">' + num(a.percentage, 0) + '%</td>' +
            '<td data-label="Submitted">' + esc(fmtDate(a.submittedAt, true)) + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>' +
        '<p class="small muted">Class average: ' + num(results.average, 0) + '%</p>'
      : '<p class="small muted">No learning data available yet.</p>';

    setView(
      pageHead(quiz.title, 'Quiz · ' + titleCase(quiz.status) + ' · maximum score ' + num(quiz.maxScore, 0),
        '<button class="btn secondary" data-act="quiz-edit">Settings</button> ' +
        '<button class="btn secondary" data-act="quiz-save-questions">Save questions</button> ' +
        (quiz.status === 'PUBLISHED'
          ? '<button class="btn secondary" data-act="quiz-status" data-status="DRAFT">Unpublish</button>'
          : '<button class="btn" data-act="quiz-status" data-status="PUBLISHED">Publish</button>') + ' ' +

function collectQuizPoints() {
  qsa('[data-points]').forEach(function (el) {
    var id = el.getAttribute('data-points');
    State.view.quizQuestions.forEach(function (q) {
      if (q.questionId === id) q.points = Math.max(1, num(el.value, 1));
    });
  });
}
Actions['quiz-add-question'] = function (btn) {
  collectQuizPoints();
  var id = btn.getAttribute('data-id');
  var exists = State.view.quizQuestions.some(function (q) { return q.questionId === id; });
  if (exists) { toast('That question is already in the quiz.', 'error'); return; }
  State.view.quizQuestions.push({ questionId: id, points: 1 });
  saveQuizQuestions(btn);
};
Actions['quiz-remove-question'] = function (btn) {
  collectQuizPoints();
  var id = btn.getAttribute('data-id');
  State.view.quizQuestions = State.view.quizQuestions.filter(function (q) { return q.questionId !== id; });
  saveQuizQuestions(btn);
};
Actions['quiz-save-questions'] = function (btn) { collectQuizPoints(); saveQuizQuestions(btn); };

function saveQuizQuestions(btn) {
  busy(btn, true, 'Saving…');
  api('quiz.setQuestions', { id: State.view.quiz.id, questions: State.view.quizQuestions })
    .then(function () { toast('Quiz questions saved.', 'success'); viewQuizBuilder(State.view.quiz.id); })
    .catch(function (error) { busy(btn, false); toast(error.message, 'error'); });
}
Actions['quiz-status'] = function (btn) {
  var status = btn.getAttribute('data-status');
